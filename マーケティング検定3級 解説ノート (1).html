<!DOCTYPE html>

<head>

<style>
:root{
  --paper:#EEF2EF; --sheet:#FBFCFB; --ink:#1D2A28; --muted:#5D6B68; --line:#D3DBD7;
  --mark:#F3DD6B; --done:#2C7A57; --done-bg:#DDEFE5; --miss:#B93A33; --hover:#E4EBE7;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B1A; --sheet:#1B2422; --ink:#E4ECE8; --muted:#9AAAA5; --line:#2E3B38;
    --mark:#8C7A22; --done:#6CCB9C; --done-bg:#1F3A2F; --miss:#F07C72; --hover:#223030;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141B1A; --sheet:#1B2422; --ink:#E4ECE8; --muted:#9AAAA5; --line:#2E3B38;
  --mark:#8C7A22; --done:#6CCB9C; --done-bg:#1F3A2F; --miss:#F07C72; --hover:#223030;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-size:16px;line-height:1.75}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--done);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(300px,360px) 1fr;height:100%}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.head{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.head h1{font-family:"Shippori Mincho",serif;font-weight:800;font-size:1.3rem;line-height:1.35;margin:0 0 14px}
.prog{display:flex;align-items:baseline;gap:10px}
.prog .pct{font-family:"Shippori Mincho",serif;font-weight:800;font-size:2rem;line-height:1}
.prog .cnt{color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.list{overflow-y:auto;flex:1;padding:4px 0 24px}
.unit{font-size:.8rem;font-weight:700;color:var(--muted);padding:18px 20px 6px;letter-spacing:.04em}
.row{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:8px;padding:7px 12px 7px 20px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.row:hover{background:var(--hover)}
.row[aria-current="true"]{background:var(--sheet);box-shadow:inset 3px 0 0 var(--ink)}
.row .no{font-family:"Shippori Mincho",serif;font-weight:800;color:var(--muted);font-size:.95rem}
.row .tt{font-size:.92rem;line-height:1.45}
.row.ok .tt{color:var(--muted)}
.chk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.chk svg{width:14px;height:14px;opacity:0}
.chk.on{background:var(--done);border-color:var(--done)}
.chk.on svg{opacity:1}
.chk svg path{stroke:var(--sheet)}

.main{overflow-y:auto;min-height:0;background:var(--sheet)}
.doc{max-width:720px;margin:0 auto;padding:40px 32px 64px}
.back{display:none;border:0;background:none;color:var(--muted);padding:0;margin-bottom:16px;cursor:pointer;font-size:.95rem}
.meta{color:var(--muted);font-size:.85rem}
.ttl{display:flex;gap:16px;align-items:baseline;margin:6px 0 18px}
.ttl .big{font-family:"Shippori Mincho",serif;font-weight:800;font-size:3rem;line-height:1}
.ttl h2{font-family:"Shippori Mincho",serif;font-weight:800;font-size:1.6rem;line-height:1.4;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.92rem}
.facts b{font-weight:700}
.x{color:var(--miss);font-weight:700}
.o{color:var(--done);font-weight:700}
.toggle{margin:20px 0 8px;display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 20px;cursor:pointer;font-weight:700}
.toggle.on{background:var(--done);border-color:var(--done);color:var(--sheet)}
.body{margin-top:18px}
.body p{margin:0 0 1em}
.body h3{font-size:1.08rem;font-weight:700;margin:1.8em 0 .5em;padding-bottom:4px;border-bottom:1px solid var(--line)}
.body ul{margin:0 0 1em;padding-left:1.3em}
.body li{margin:.3em 0}
.body ul ul{margin:.3em 0 .2em}
.body strong{font-weight:700;background:linear-gradient(transparent 62%,var(--mark) 62%)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.nav button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 14px;cursor:pointer;max-width:48%;text-align:left;font-size:.9rem;line-height:1.4}
.nav button:hover{background:var(--hover)}
.nav button:disabled{visibility:hidden}
.nav .nx{text-align:right;margin-left:auto}
.nav small{display:block;color:var(--muted)}

.topbar,.botbar{display:none}
button,.row{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}

  .side{border-right:0}
  .app.reading .side{display:none}
  .app:not(.reading) .main{display:none}

  .head h1{font-size:1.1rem;margin-bottom:8px}
  .head h1 br{display:none}
  .prog .pct{font-size:1.6rem}
  .unit{padding:16px 16px 6px}
  .row{padding:10px 8px 10px 16px;min-height:52px}
  .row .tt{font-size:.95rem}
  .chk{width:40px;height:40px}
  .chk svg{width:18px;height:18px}
  .main{display:flex;flex-direction:column}
  .topbar{display:flex;position:sticky;top:0;z-index:5;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;background:var(--paper);border-bottom:1px solid var(--line)}
  .topbar .tb-back{border:0;background:none;padding:10px 8px;font-size:.95rem;color:var(--muted);cursor:pointer}
  .topbar .tb-no{font-size:.85rem;color:var(--muted)}
  .topbar .tb-chk{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem;cursor:pointer;min-height:40px}
  .topbar .tb-chk.on{background:var(--done);border-color:var(--done);color:var(--sheet)}
  .doc{padding:18px 18px 32px;flex:1;width:100%}
  .doc .toggle,.doc .nav{display:none}
  .ttl{gap:12px;margin:4px 0 14px}
  .ttl .big{font-size:2.2rem}
  .ttl h2{font-size:1.3rem}
  .body{line-height:1.85}
  .body ul{padding-left:1.15em}
  .botbar{display:flex;position:sticky;bottom:0;z-index:5;gap:8px;padding:8px 10px;background:var(--paper);border-top:1px solid var(--line)}
  .botbar button{flex:1;min-height:48px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;font-size:.92rem;cursor:pointer;padding:6px 10px;line-height:1.3}
  .botbar button:disabled{opacity:.35}
}

<script>
const D1 = [
{n:1,u:"マーケティングの基本概念/市場環境",t:"マーケティング・コンセプト",a:"ウ",r1:"〇",r2:"〇",b:`**マーケティング・コンセプト**とは、企業が「何を大切にして商品を売るか」という経営の基本的な考え方のことです。時代とともに次のように変化してきました。

## 考え方の移り変わり
- **生産志向**：作れば売れる時代。とにかく大量に安く作ることを重視します。
- **製品志向**：良い製品を作れば売れる、という考え方。品質や性能の向上に力を入れます。
- **販売志向**：作った物をどう売り込むかを重視。広告や営業で押し込みます。
- **マーケティング志向（顧客志向）**：顧客のニーズを先に調べ、それに合う物を作って届けます。現在のマーケティングの基本です。
- **社会志向（ソーシャル・マーケティング）**：顧客の満足だけでなく、環境や社会全体の幸福も考えます。

## 具体例
飲料メーカーで考えると、生産志向は「同じジュースを大量生産」、販売志向は「テレビCMで大量に宣伝」、顧客志向は「健康を気にする人向けに無糖茶を開発」、社会志向は「リサイクルしやすいラベルレスボトルにする」となります。

## ポイント
「売る側の都合」から「買う側の都合」へ、さらに「社会全体の利益」へと視点が広がってきた、という流れで覚えると整理しやすくなります。`},
{n:2,u:"マーケティングの基本概念/市場環境",t:"STP",a:"イ",r1:"〇",r2:"✕",b:`**STP**は、誰に・どんな価値を売るかを決めるための3つのステップの頭文字です。

## 3つのステップ
- **S：セグメンテーション（市場細分化）**：市場全体を、似たニーズを持つグループに分けます。
- **T：ターゲティング（標的市場の選定）**：分けたグループの中から、自社が狙うグループを選びます。
- **P：ポジショニング（立ち位置の決定）**：ターゲットの頭の中で、競合と比べてどんな存在として認識されたいかを決めます。

## 具体例：フィットネスジム
- S：利用者を「本格的に鍛えたい人」「ダイエットしたい女性」「運動習慣のない高齢者」などに分ける
- T：「仕事帰りに短時間で運動したい会社員」を狙う
- P：「24時間いつでも、月額が安い、予約不要のジム」として認識してもらう

## ポイント
順番は必ず **S→T→P** です。STPで「誰に何を」が決まったら、次に4P（マーケティング・ミックス）で「どうやって」を具体化します。STPは「戦略」、4Pは「戦術」と区別して覚えると試験で迷いにくくなります。`},
{n:3,u:"マーケティングの基本概念/市場環境",t:"セグメンテーション",a:"エ",r1:"〇",r2:"〇",b:`**セグメンテーション（市場細分化）**とは、ニーズや特徴が似ている顧客ごとに市場をグループ分けすることです。すべての人を満足させる商品は作れないため、まず市場を分けて考えます。

## 4つの切り口（細分化変数）
- **地理的変数**：地域、都市の規模、気候など
- **人口動態変数（デモグラフィック）**：年齢、性別、所得、職業、家族構成など
- **心理的変数（サイコグラフィック）**：ライフスタイル、価値観、性格など
- **行動変数**：購入頻度、使用量、求めるベネフィット、ブランドへの忠誠度など

## 良いセグメントの条件
分けたグループが実際に役立つかは、次の条件で判断します。
- **測定可能性**：規模や購買力を数字で測れるか
- **到達可能性**：広告や販売網でそのグループに届くか
- **維持可能性（実質性）**：利益が出るだけの十分な規模があるか
- **実行可能性**：自社の力でそのグループ向けの施策を実行できるか
- **差別可能性**：グループごとに反応がはっきり違うか

## 具体例
シャンプー市場を「髪の悩み（行動変数）」で分けると、「フケ」「ダメージ」「ボリューム不足」などのセグメントができ、それぞれ専用の商品が作れます。`},
{n:4,u:"マーケティングの基本概念/市場環境",t:"ターゲティング",a:"イ",r1:"✕",r2:"〇",b:`**ターゲティング**とは、セグメンテーションで分けたグループの中から、自社が狙う市場（標的市場）を選ぶことです。

## 3つのアプローチ
- **無差別型マーケティング**：セグメントの違いを無視し、市場全体に1つの商品・1つの方法で売ります。コストは安いですが、多様なニーズには応えにくくなります。例：昔のコカ・コーラ（1種類のみ）。
- **差別型マーケティング**：複数のセグメントを選び、それぞれに合った商品や売り方を用意します。売上は伸びやすいですが、コストがかかります。例：自動車メーカーが軽自動車・ミニバン・高級車をそろえる。
- **集中型マーケティング**：1つまたは少数のセグメントに資源を集中させます。経営資源が少ない企業に向いていますが、その市場が縮むと影響が大きくなります。例：子ども服専門ブランド。

## どれを選ぶかの判断材料
- 自社の**経営資源**が少ない → 集中型
- **製品が同質的**（塩や砂糖など差が出にくい）→ 無差別型
- **製品ライフ・サイクル**の導入期 → 無差別型や集中型、成熟期 → 差別型
- **競合**が細かく分けて攻めている → 無差別型では不利

## ポイント
3つの型の名前と、それぞれの長所・短所の組み合わせがよく問われます。`},
{n:5,u:"マーケティングの基本概念/市場環境",t:"ポジショニング",a:"ア",r1:"〇",r2:"〇",b:`**ポジショニング**とは、ターゲット顧客の頭の中で、自社の商品を競合と比べて「独自の、価値ある位置」に置くための活動です。

大事なのは、ポジションを決めるのは企業ではなく**顧客の認識**だという点です。企業が「高級品です」と言っても、顧客がそう感じなければ意味がありません。

## ポジショニング・マップ
2つの軸（例：価格の高低 × 機能重視かデザイン重視か）を使って、自社と競合の位置を図に描く方法です。競合が少ない空白の位置を見つけたり、自社の違いを確認したりするのに役立ちます。

## 具体例：ハンバーガーチェーン
- マクドナルド：安くて早い、どこにでもある
- モスバーガー：注文後に作る、国産素材でおいしい
- 高級グルメバーガー店：価格は高いがボリュームと本格的な味

同じハンバーガーでも、顧客の頭の中では違う位置に置かれています。

## ポイント
ポジショニングはSTPの最後のステップです。ここで決めた立ち位置に合わせて4P（製品・価格・流通・販促）を一貫させることが重要です。`},
{n:6,u:"マーケティングの基本概念/市場環境",t:"ポジショニングの切り口",a:"ウ",r1:"〇",r2:"〇",b:`ポジショニングを考えるときに、「何を基準に違いを打ち出すか」を**切り口**といいます。主な切り口は次のとおりです。

## 主な切り口
- **製品の属性・ベネフィット**：機能や効果で差をつけます。例：「虫歯予防に強い歯磨き粉」「燃費がいい車」
- **使用場面・使用目的**：いつ、どんなときに使うかで差をつけます。例：「朝専用の缶コーヒー」「運動後に飲むスポーツドリンク」
- **使用者（ユーザー）**：誰が使うかで差をつけます。例：「プロも使う調理器具」「赤ちゃん用の洗剤」
- **競合との対比**：特定の競合と比べて位置を示します。例：「業界2位だからもっと頑張ります」というエイビス社（レンタカー）の広告
- **価格と品質**：「高品質・高価格」や「十分な品質で手頃な価格」などの位置を示します。
- **製品カテゴリー**：あえて別のカテゴリーと比べます。例：マーガリンを「バターの代わり」として打ち出す

## ポイント
試験では、具体的な広告文や商品の例を読んで「どの切り口に当たるか」を選ぶ問題が出やすいです。「誰が」なら使用者、「いつ・どこで」なら使用場面、「他社と比べて」なら競合との対比、と見分けると解きやすくなります。`},
{n:7,u:"マーケティングの基本概念/市場環境",t:"マーケティング・ミックス",a:"オ",r1:"〇",r2:"〇",b:`**マーケティング・ミックス**とは、ターゲット市場で目標を達成するために、企業がコントロールできる手段を組み合わせたものです。代表的なのが**4P**です。

## 4P
- **Product（製品）**：品質、機能、デザイン、ブランド、パッケージ、保証など
- **Price（価格）**：定価、割引、支払い条件など
- **Place（流通・チャネル）**：販売場所、流通経路、在庫、物流など
- **Promotion（プロモーション）**：広告、販売促進、人的販売、PRなど

## 2つの整合性
マーケティング・ミックスは、組み合わせが重要です。
- **4P同士の整合性（内的整合性）**：4つが互いに矛盾していないか。高級品をディスカウント店で売ると、価格と流通が矛盾します。
- **ターゲットとの整合性（外的整合性）**：4P全体が狙う顧客に合っているか。

## 具体例
高級化粧品なら、高品質な製品・高価格・百貨店の専用カウンター・美容部員による丁寧な接客と上品な広告、という形で4つがそろいます。

## ポイント
4Pは企業が**自分で決められる要素（統制可能要因）**です。景気や法律、競合の動きなど自分で決められないもの（統制不可能要因）と区別して覚えましょう。`},
{n:8,u:"マーケティングの基本概念/市場環境",t:"4Pと4C",a:"ウ",r1:"✕",r2:"〇",b:`4Pと4Cは、どちらも商品を売るための枠組みですが、**4Pは売り手（企業）の視点、4Cは買い手（顧客）の視点**です。

## 対応関係
- **Product（製品）↔ Customer Value（顧客価値）**：「何を作るか」ではなく「顧客にどんな価値があるか」
- **Price（価格）↔ Cost（顧客の負担）**：お金だけでなく、時間や手間も含めた顧客の負担
- **Place（流通）↔ Convenience（利便性）**：「どこで売るか」ではなく「どれだけ楽に手に入るか」
- **Promotion（販促）↔ Communication（コミュニケーション）**：一方的な宣伝ではなく、顧客との双方向の対話

## 提唱者
- 4P：**マッカーシー**（1960年代）
- 4C：**ラウターボーン**（1990年代）

## 具体例：コンビニのコーヒー
4Pで見ると「本格コーヒー・100円台・全国の店舗・アプリのクーポン」。4Cで見ると「安くておいしい・待ち時間1分・近所でいつでも買える・アプリで感想や情報のやりとり」となります。

## ポイント
4Cは4Pを否定するものではなく、組み合わせて使います。「4Cで顧客の求めるものを考え、4Pで具体的な施策にする」という流れです。PriceとCostの対応で、Costに「時間や労力」も含む点はよく問われます。`},
{n:9,u:"マーケティングの基本概念/市場環境",t:"マーケティング・マネジメント",a:"ア",r1:"〇",r2:"〇",b:`**マーケティング・マネジメント**とは、マーケティング活動を計画し、実行し、その結果を確かめて改善していく一連の管理プロセスのことです。

## 基本の流れ
- **分析**：市場環境、顧客、競合、自社の強み・弱みを調べます（SWOT分析など）。
- **計画**：目標を決め、STP（誰に、どんな価値を）とマーケティング・ミックス（4P）を組み立てます。
- **実行**：計画した施策を、組織を動かして実際に行います。
- **統制（評価）**：売上や利益、シェアなどの結果を目標と比べ、ずれがあれば原因を調べて修正します。

これは**PDCAサイクル**（Plan→Do→Check→Action）と同じ考え方です。

## 具体例：新しいお菓子の発売
- 分析：健康志向が高まり、低糖質のお菓子が伸びている
- 計画：30代の健康を気にする会社員向けに、低糖質チョコをコンビニで200円で販売
- 実行：生産・配荷・SNS広告を行う
- 統制：3か月後の売上が目標の7割 → 店頭での目立ち方が弱いとわかり、売場の販促物を見直す

## ポイント
マーケティングは「作って終わり」ではなく、**結果を評価してまた計画に戻す循環**であることが大切です。`},
{n:10,u:"マーケティングの基本概念/市場環境",t:"企業を取り巻く環境の要因",a:"オ",r1:"〇",r2:"〇",b:`企業のマーケティングは、さまざまな環境の影響を受けます。環境は大きく**マクロ環境**と**ミクロ環境**に分けられます。

## マクロ環境（社会全体の大きな流れ）
自社ではコントロールできず、業界全体に影響します。**PEST分析**で整理します。
- **P：政治・法律**（Politics）：法改正、規制、税制。例：レジ袋の有料化
- **E：経済**（Economy）：景気、物価、為替、金利。例：円安による輸入原料の値上がり
- **S：社会・文化**（Society）：人口、少子高齢化、価値観、流行。例：健康志向の高まり
- **T：技術**（Technology）：新技術の登場。例：スマホ決済の普及

## ミクロ環境（自社の身近な関係者）
- 顧客、競合他社、供給業者（仕入れ先）、流通業者、株主や地域社会など

## 内部環境
自社の経営資源（人材・設備・資金・技術・ブランドなど）です。

## SWOT分析との関係
内部環境から**強み（S）・弱み（W）**、外部環境から**機会（O）・脅威（T）**を整理するのがSWOT分析です。

## ポイント
「この要因は自社でコントロールできるか」「マクロかミクロか」を見分ける問題がよく出ます。人口動態や法律はマクロ、競合や取引先はミクロです。`},
{n:11,u:"戦略的マーケティング",t:"5つの競争要因",a:"ア",r1:"〇",r2:"〇",b:`**5つの競争要因（ファイブフォース）**は、マイケル・**ポーター**が提唱した、業界の収益性（儲けやすさ）を分析する枠組みです。5つの圧力が強いほど、利益を出しにくい業界になります。

## 5つの要因
- **業界内の競争**：同業他社との競争。企業が多い、製品に差がない、市場の成長が止まっている場合に激しくなります。例：牛丼チェーンの値下げ競争
- **新規参入の脅威**：新しい企業が入りやすいか。設備投資が少なく済む、規制がない業界ほど脅威が大きくなります。
- **代替品の脅威**：別の業界の商品が同じニーズを満たすこと。例：映画館に対する動画配信サービス
- **買い手の交渉力**：顧客が値下げなどを求める力。顧客が大企業、乗り換えが簡単な場合に強くなります。例：食品メーカーに対する大手スーパー
- **売り手（供給業者）の交渉力**：仕入れ先が値上げなどを求める力。供給元が少なく代わりがない場合に強くなります。例：パソコンメーカーに対するCPUメーカー

## 参入障壁の例
規模の経済性、巨額の設備投資、ブランド力、流通チャネルの確保、法規制、特許など。

## ポイント
競争相手は同業他社だけではない、というのが最大のポイントです。「代替品」と「新規参入」の違い（別業界の商品か、同じ業界に入ってくる新会社か）はよく問われます。`},
{n:12,u:"戦略的マーケティング",t:"経営資源の分析",a:"イ",r1:"〇",r2:"〇",b:`**経営資源**とは、企業が事業を行うために使える力のことで、一般に**ヒト・モノ・カネ・情報**の4つに分けられます。情報には技術、ノウハウ、ブランド、顧客データなどが含まれます。

## 経営資源をどう評価するか：VRIO分析
経営資源が競争で本当に強みになるかを、4つの問いで確かめます（バーニーが提唱）。
- **V：Value（経済的価値）**：その資源は機会を活かしたり、脅威を防いだりできるか
- **R：Rarity（希少性）**：その資源を持つ企業は少ないか
- **I：Inimitability（模倣困難性）**：他社が真似するのは難しいか（お金や時間がかかるか）
- **O：Organization（組織）**：その資源を活かす仕組みが社内にあるか

4つすべて満たすと、**持続的な競争優位**になります。

## 具体例
老舗和菓子店の「100年続くブランドと職人の技術」は、価値があり、珍しく、すぐには真似できず、職人を育てる仕組みがあれば、長く続く強みになります。一方、「駅前の立地」は価値はあっても、他店も出店できれば希少性は低くなります。

## ポイント
外部環境の分析（ファイブフォースやPEST）と組み合わせて、自社の強み・弱みを把握し、SWOT分析につなげます。目に見えにくい「情報的資源（ノウハウ・ブランド）」は真似されにくく、強みになりやすい点も重要です。`},
{n:13,u:"戦略的マーケティング",t:"製品−市場マトリックス",a:"エ",r1:"〇",r2:"〇",b:`**製品−市場マトリックス**は、**アンゾフ**が提唱した成長戦略の枠組みです。「製品」と「市場」をそれぞれ**既存か新規か**で分け、4つの戦略に整理します。

## 4つの成長戦略
- **市場浸透戦略**（既存製品×既存市場）：今の商品を今の顧客にもっと買ってもらいます。例：ポイント還元で来店回数を増やす、使用量を増やす提案
- **市場開拓戦略**（既存製品×新市場）：今の商品を新しい顧客や地域に売ります。例：日本の調味料を海外で販売、大人向け商品を高齢者に提案
- **製品開発戦略**（新製品×既存市場）：今の顧客に新しい商品を売ります。例：ビールメーカーがノンアルコールビールを発売
- **多角化戦略**（新製品×新市場）：新しい商品で新しい市場に出ます。例：フィルムメーカーが化粧品事業に参入

## リスクの大きさ
市場浸透が最もリスクが低く、**多角化が最もリスクが高い**とされます。製品も市場も経験がないためです。

## ポイント
試験では具体例を読んで4つのどれに当たるかを答える問題がよく出ます。「製品が新しいか」「売る相手が新しいか」の2点を順番にチェックすると、確実に見分けられます。`},
{n:14,u:"戦略的マーケティング",t:"製品ポートフォリオ・マネジメント",a:"オ",r1:"✕",r2:"✕",b:`**製品ポートフォリオ・マネジメント（PPM）**は、ボストン・コンサルティング・グループ（**BCG**）が開発した手法で、複数の事業や製品にお金（資金）をどう配分するかを考えるためのものです。

## 2つの軸
- **縦軸：市場成長率**（その市場がどれだけ伸びているか）
- **横軸：相対的市場シェア**（業界トップ企業と比べた自社のシェア）

## 4つの分類
- **花形（スター）**：成長率高・シェア高。売上は大きいが、成長市場で競争に勝つための投資も大きい。資金の出入りがどちらも大きい。
- **金のなる木**：成長率低・シェア高。市場が成熟しているので大きな投資はいらず、シェアが高いので利益が多い。**資金を生み出す源**。
- **問題児**：成長率高・シェア低。成長市場なので投資が必要だが、シェアが低く利益は少ない。投資して花形に育てるか、撤退するかを判断する。
- **負け犬**：成長率低・シェア低。利益も成長も見込めないため、撤退や縮小を検討する。

## 理想的な資金の流れ
**金のなる木で稼いだ資金を、問題児に投資して花形に育てる**。花形はやがて市場の成長が止まると金のなる木になります。

## 覚え方のコツ
- シェアが高い＝お金が入ってくる（花形・金のなる木）
- 成長率が高い＝お金が出ていく（花形・問題児）

この2つを組み合わせると、金のなる木は「入る多い・出る少ない」、問題児は「入る少ない・出る多い」とわかります。

## 注意点
横軸は単純なシェアではなく、**最大の競合と比べた相対シェア**です。また、PPMは事業間の相乗効果（シナジー）を考慮しない、という限界もあります。`},
{n:15,u:"戦略的マーケティング",t:"3つの基本戦略",a:"ウ",r1:"✕",r2:"〇",b:`**3つの基本戦略**は**ポーター**が提唱した、競争に勝つための基本的な戦い方です。「何で勝つか（低コストか差別化か）」と「どこで戦うか（業界全体か特定市場か）」で整理されます。

## 3つの戦略
- **コスト・リーダーシップ戦略**（業界全体×低コスト）：業界で最も低いコストを実現して勝ちます。大量生産、効率化、規模の経済性を活かします。例：ユニクロ、業務スーパー
- **差別化戦略**（業界全体×差別化）：品質、デザイン、ブランド、サービスなどで独自の価値を出し、高くても選ばれることで勝ちます。例：Apple、スターバックス
- **集中戦略**（特定市場）：特定の顧客層・地域・製品分野に絞り込みます。さらに次の2つに分かれます。
  - **コスト集中**：絞った市場で低コストを武器にする。例：格安航空会社
  - **差別化集中**：絞った市場で独自性を武器にする。例：高級時計ブランド、職人向け作業服

## スタック・イン・ザ・ミドル
どの戦略もはっきり選ばず中途半端になると、安さでも独自性でも負けて誰にも選ばれなくなります。ポーターはこれを最も危険な状態としました。

## ポイント
集中戦略が「コスト集中」と「差別化集中」の2つに分かれる点、そして中途半端の危険性（スタック・イン・ザ・ミドル）がよく問われます。`},
{n:16,u:"戦略的マーケティング",t:"市場地位別の競争戦略",a:"ウ",r1:"〇",r2:"〇",b:`**市場地位別の競争戦略**は**コトラー**が提唱したもので、業界での立場（シェアの順位）によって取るべき戦略が違う、という考え方です。

## 4つの地位と戦略
- **リーダー**（業界トップ）：シェアを守り、市場全体を大きくします。
  - **周辺需要の拡大**：市場全体のパイを広げる（新しい使い方の提案など）
  - **同質化**：チャレンジャーの新製品を真似して、差別化を打ち消す
  - **非価格対応**：値下げ競争には乗らない
  - **全方位型**：すべての顧客層をカバーする
- **チャレンジャー**（2〜3位でトップを狙う）：リーダーができないことで**差別化**し、シェアを奪いにいきます。
- **フォロワー**（トップを狙わない）：上位企業を**模倣**し、開発コストを抑えて利益を確保します。
- **ニッチャー**（すき間を狙う）：大手が狙わない小さな市場に**特化（集中）**し、その中でトップになります。

## 具体例：ビール業界のイメージ
リーダーは定番商品を全国で幅広く展開、チャレンジャーは新しい味や製法で勝負、フォロワーは人気商品に似た安価な商品を出す、ニッチャーはクラフトビールで熱心なファンをつかむ、という形です。

## ポイント
「リーダー＝同質化・周辺需要拡大」「チャレンジャー＝差別化」「フォロワー＝模倣」「ニッチャー＝特定化（集中）」の組み合わせが最重要です。`},
{n:17,u:"マーケティングリサーチ",t:"マーケティング・リサーチのデザイン",a:"イ",r1:"✕",r2:"〇",b:`**マーケティング・リサーチ**とは、マーケティングの意思決定に必要な情報を集め、分析することです。調査の目的によって、大きく3つの種類（デザイン）に分けられます。

## 3つのリサーチ・デザイン
- **探索的リサーチ**：問題が何かはっきりしないときに、手がかりや仮説を見つけるための調査です。少人数へのインタビューや文献調査など、柔軟な方法を使います。例：「最近売上が落ちたが原因がわからない」→ 顧客に話を聞いて原因の候補を探す
- **記述的リサーチ**：市場や顧客の状態を正確に**数字で描き出す**調査です。「誰が、何を、いつ、どこで、どれだけ」を明らかにします。アンケート調査が代表的です。例：「20代の何%が週1回以上コンビニでコーヒーを買うか」
- **因果的リサーチ**：「Aを変えるとBが変わるか」という**原因と結果の関係**を確かめる調査です。主に**実験**を使います。例：「価格を10%下げると販売数は何%増えるか」を一部の店で試す

## 一般的な流れ
探索的リサーチで仮説を立てる → 記述的リサーチや因果的リサーチで仮説を確かめる、という順番で進めることが多いです。

## ポイント
「仮説を見つける＝探索的」「実態を数字で表す＝記述的」「因果関係を確かめる＝因果的（実験）」と、目的と方法の組み合わせで覚えましょう。`},
{n:18,u:"マーケティングリサーチ",t:"探索的リサーチの主要な手法",a:"ウ",r1:"✕",r2:"〇",b:`**探索的リサーチ**は、問題をはっきりさせたり、仮説を見つけたりするための調査です。数字で厳密に測るよりも、幅広く手がかりを集めることを重視します。

## 主な手法
- **文献調査（二次データの調査）**：すでにある資料を調べます。政府の統計、業界団体の報告書、新聞記事、社内の販売データなど。安く早くできるので、最初に行うことが多いです。
- **専門家への調査（経験調査）**：その分野に詳しい人に話を聞きます。例：販売店の店長、業界の専門家、営業担当者
- **ケーススタディ（事例研究）**：似た状況の事例を詳しく調べます。例：他社の成功事例・失敗事例の分析
- **フォーカス・グループ・インタビュー**：6〜8人程度の対象者を集め、司会者（モデレーター）のもとで自由に話し合ってもらいます。参加者同士の発言が刺激し合い、多くの意見が出やすいのが特徴です。
- **デプス・インタビュー（深層面接）**：1対1でじっくり話を聞き、本音や深い動機を探ります。他人の前では話しにくいテーマに向いています。

## ポイント
探索的リサーチは**定性調査**（言葉や意見を集める）が中心で、結果を市場全体に当てはめる（一般化する）ことには向きません。「グループで話し合う＝フォーカス・グループ」「1対1で深く聞く＝デプス・インタビュー」の違いはよく問われます。`},
{n:19,u:"マーケティングリサーチ",t:"データの収集と測定",a:"ウ",r1:"✕",r2:"〇",b:`マーケティング・リサーチで使うデータは、まず**一次データ**と**二次データ**に分けられます。

## 一次データと二次データ
- **一次データ**：今回の調査目的のために、新しく自分で集めるデータです。目的にぴったり合いますが、時間とお金がかかります。
- **二次データ**：別の目的ですでに集められたデータです。政府統計や業界の報告書、社内の売上記録など。安く早く手に入りますが、目的に完全には合わないことがあります。

一般には、**まず二次データを調べ、足りない部分を一次データで補う**のが基本です。

## 一次データの集め方
- **質問法**：アンケートやインタビューで直接たずねます。面接、郵送、電話、インターネットなどの方法があります。
- **観察法**：人の行動を観察して記録します。例：店内で客がどの棚の前で立ち止まるかを見る。本人が意識していない行動もわかります。
- **実験法**：条件を変えて結果の違いを比べます。因果関係を確かめるのに使います。

## 測定の良さを判断する2つの基準
- **信頼性**：何度測っても同じ結果が出るか（安定しているか）
- **妥当性**：測りたいものを本当に測れているか

例えば体重計で何回量っても同じ数字なら信頼性は高いですが、身長を知りたいのに体重計を使えば妥当性はありません。

{n:20,u:"マーケティングリサーチ",t:"測定尺度の種類",a:"エ",r1:"✕",r2:"〇",b:`調査で集めたデータは、その性質によって4種類の**測定尺度**に分けられます。どの尺度かによって、使える計算や分析方法が変わります。

## 4つの尺度（情報量が少ない順）
- **名義尺度**：区別するためだけの数字です。順番や大きさに意味はありません。例：性別（男性＝1、女性＝2）、血液型、背番号、都道府県コード。できる計算は「数を数える（度数・最頻値）」だけです。
- **順序尺度**：順番には意味がありますが、間隔は等しくありません。例：好きなブランドの順位、満足度の「とても満足・満足・不満」、成績の順位。1位と2位の差と、2位と3位の差が同じとは限りません。中央値が使えます。
- **間隔尺度**：目盛りの間隔が等しく、足し算・引き算ができますが、**絶対的なゼロがありません**。例：気温（℃）、西暦。0℃は「温度がない」という意味ではないので、「20℃は10℃の2倍暑い」とは言えません。平均値が使えます。
- **比率尺度**：間隔が等しく、**絶対的なゼロがある**尺度です。例：売上金額、身長、体重、購入個数、年齢。「売上100万円は50万円の2倍」と言えます。四則演算がすべてできます。

## 覚え方
「**名・順・間・比**」の順に情報が増えていきます。
- 区別だけ → 名義
- 順番がある → 順序
- 差に意味がある → 間隔
- 比（何倍）に意味がある → 比率

## ポイント
試験では例を出して尺度を答えさせる問題が多いです。「0の意味」で間隔尺度と比率尺度を見分けるのがコツです。`},
{n:21,u:"マーケティングリサーチ",t:"統計的検定の考え方",a:"エ",r1:"✕",r2:"〇",b:`**統計的検定**とは、調査で出た差や関係が「偶然によるものか、本当に意味のあるものか」を判断する方法です。

## 基本の考え方
- **帰無仮説**：「差はない」「関係はない」という、否定したい仮説です。例：「新パッケージと旧パッケージで売上に差はない」
- **対立仮説**：「差がある」という、本当に示したい仮説です。

検定では、まず帰無仮説が正しいと仮定します。そのうえで、今回のデータが出る確率がとても小さければ、「帰無仮説は間違っている」と判断して**棄却**し、対立仮説を採用します。

## 有意水準とp値
- **有意水準**：「とても小さい確率」の基準。一般に**5%**（または1%）を使います。
- **p値**：帰無仮説が正しいとしたとき、今回のような結果が偶然出る確率です。
- **p値 < 有意水準** なら帰無仮説を棄却し、「統計的に有意な差がある」といいます。

## 2種類の誤り
- **第1種の過誤**：本当は差がないのに「差がある」と判断してしまう誤り（あわてんぼうの誤り）。その確率が有意水準です。
- **第2種の過誤**：本当は差があるのに「差がない」と判断してしまう誤り（ぼんやりの誤り）。

## 具体例
新しい広告を見た人の購入率が旧広告より3%高かったとき、検定でp値が0.02（2%）なら、5%水準で「新広告の効果は偶然ではない」と判断できます。

## ポイント
「帰無仮説は否定するために立てる仮説」という点と、第1種・第2種の過誤の違いがよく問われます。`},
{n:22,u:"マーケティングリサーチ",t:"様々な統計的検定・分析",a:"ウ",r1:"✕",r2:"〇",b:`マーケティング・リサーチでよく使う検定・分析手法を、「何を知りたいか」で整理します。

## 差を調べる検定
- **t検定**：**2つのグループの平均値**に差があるかを調べます。例：男性と女性で商品の満足度の平均に差があるか
- **分散分析（ANOVA）**：**3つ以上のグループの平均値**に差があるかを調べます。例：20代・30代・40代で満足度に差があるか
- **カイ二乗（χ²）検定**：**クロス集計表**で、2つの項目に関係があるか（独立かどうか）を調べます。例：性別と好きなブランドに関係があるか。名義尺度のデータでも使えます。

## 関係や構造を調べる分析
- **相関分析**：2つの変数がどれだけ一緒に動くかを、−1〜1の相関係数で表します。例：気温とアイスの売上
- **回帰分析**：ある変数（原因）から別の変数（結果）を予測する式を作ります。例：広告費から売上を予測。原因が複数なら**重回帰分析**。
- **因子分析**：たくさんの質問項目の背後にある共通の要因（因子）を見つけます。例：20項目の評価を「品質」「価格」「デザイン」の3因子にまとめる
- **クラスター分析**：似た回答をした人をグループに分けます。セグメンテーションに使われます。
- **コンジョイント分析**：商品の属性（価格・色・機能など）のどれを顧客が重視するかを調べます。

## ポイント
「2群の平均＝t検定」「3群以上の平均＝分散分析」「クロス集計＝カイ二乗検定」の対応は特によく出ます。`},
{n:23,u:"消費者行動",t:"消費者の知覚",a:"エ",r1:"✕",r2:"〇",b:`**知覚**とは、目や耳などで受け取った情報を選び、整理し、意味づけするプロセスのことです。同じ広告を見ても、人によって受け取り方が違うのはこのためです。

## 選択的な知覚
人は毎日大量の情報にさらされているため、すべてを受け取るわけではありません。
- **選択的注意**：自分に関係ある情報や、目立つ情報だけに注意を向けます。例：車を買おうと思っている人は、車の広告によく気づく
- **選択的歪曲**：自分の考えや好みに合うように情報を解釈します。例：好きなブランドの欠点は気にならない
- **選択的保持**：自分の考えに合う情報だけを覚えておきます。

## 閾値（いきち）と丁度可知差異
- **絶対閾**：刺激として感じ取れる最小の強さです。
- **丁度可知差異（JND）**：2つの刺激の違いに気づける最小の差です。
- **ウェーバーの法則**：気づける差の大きさは、元の刺激の大きさに比例します。例：100円の商品が10円値上がりすると気づきやすいが、10万円の商品が10円値上がりしても気づかない

## マーケティングへの活用
値上げや内容量の削減は丁度可知差異より小さく抑えると気づかれにくく、値下げは気づかれるように丁度可知差異より大きくします。

## ポイント
ウェーバーの法則は「差の絶対量ではなく、元の大きさに対する割合で感じる」という点が重要です。`},
{n:24,u:"消費者行動",t:"ブランド・カテゴライゼーション",a:"ア",r1:"✕",r2:"〇",b:`**ブランド・カテゴライゼーション**とは、消費者が頭の中で、ある製品分野のブランドをいくつかのグループに分けて整理していることを示す考え方です。購入を検討するとき、すべてのブランドを比べるわけではありません。

## ブランドの分類
- **知名集合**：消費者が**知っている**ブランド全体
- **非知名集合**：存在を知らないブランド
知名集合はさらに次のように分かれます。
- **処理集合**：知っていて、ある程度の情報や評価を持っているブランド
- **非処理集合**：名前は知っているが、詳しく知らず評価もしていないブランド
処理集合はさらに3つに分かれます。
- **想起集合（考慮集合）**：購入の候補として**真剣に検討する**ブランド。普通は数個に絞られます。
- **保留集合**：良いとも悪いとも決めかねているブランド
- **拒否集合**：「これは買わない」と決めているブランド

## 具体例：シャンプー選び
知っているブランドは10個あっても、実際に買う候補（想起集合）は2〜3個で、「以前使って髪に合わなかったブランド」は拒否集合に入ります。

## ポイント
企業にとって大切なのは、自社ブランドを**想起集合に入れてもらうこと**です。どれほど良い商品でも、候補に入らなければ選ばれません。広告で認知を高め、試供品で試してもらうのは、想起集合に入るための活動です。`},
{n:25,u:"消費者行動",t:"消費者の認知的枠組み",a:"エ",r1:"〇",r2:"〇",b:`消費者は、新しい情報をゼロから理解するのではなく、頭の中にある**知識の枠組み**を使って理解・判断しています。

## 主な認知的枠組み
- **カテゴリー**：似たものをまとめたグループです。例：「スポーツドリンク」「エナジードリンク」。新商品を見たとき、どのカテゴリーに入るかで理解が速くなります。
- **プロトタイプと典型性**：カテゴリーを代表する「いかにもそれらしい」ものをプロトタイプといいます。例：「スポーツドリンク」と聞いてポカリスエットを思い浮かべる。プロトタイプに近いほど典型性が高いといいます。
- **スキーマ**：ある物事についての、まとまった知識や思い込みです。例：「高級ブランドは品質が良い」「オーガニック＝体に良い」
- **スクリプト**：ある場面での行動の手順についての知識です。例：「レストランでは、席に案内される→注文→食事→会計」

## マーケティングへの活用
- 新商品を既存のカテゴリーに入れると理解されやすくなります（例：「飲むヨーグルト」）。
- 逆にあえてカテゴリーの典型から少しずらすと、注目を集めやすくなります。
- スクリプトから外れたサービス（例：注文がタブレット）は、最初に手順の説明が必要です。

## ポイント
消費者は**既存の知識を手がかりに効率よく判断している**という考え方が基本です。各用語の意味と例の組み合わせを確認しておきましょう。`},
{n:26,u:"消費者行動",t:"消費者意思決定プロセス",a:"ア",r1:"✕",r2:"〇",b:`**消費者意思決定プロセス**とは、消費者が商品を買うまで、そして買った後にたどる5つの段階のことです。

## 5つの段階
- **① 問題認識（欲求認識）**：理想と現実のギャップに気づきます。例：スマホの電池がすぐ切れる→新しいスマホが欲しい
- **② 情報探索**：解決方法を調べます。
  - **内部探索**：自分の記憶や過去の経験から探す
  - **外部探索**：口コミ、ネット、店員、広告などから探す
- **③ 代替案の評価**：候補をいくつかの基準（価格、性能、デザインなど）で比べます。
- **④ 購買決定**：どれを、どこで、いつ買うかを決めて購入します。
- **⑤ 購買後の評価**：使ってみて満足か不満かを判断します。満足すれば再購入や良い口コミにつながります。

## 認知的不協和
高い買い物をした後に「本当にこれで良かったのか」と不安になることを**認知的不協和**といいます。人はこの不安を減らすため、買った商品の良い情報を探したり、選ばなかった商品の欠点を思い出したりします。企業は購入後のフォロー（お礼の連絡、使い方の案内、保証）で不協和を減らすことができます。

## ポイント
プロセスの**順番**と、「内部探索と外部探索の違い」「購買後の評価（認知的不協和）」がよく問われます。日用品のように慣れた買い物では、いくつかの段階が省略されることもあります。`},
{n:27,u:"消費者行動",t:"消費者の問題解決パターン",a:"ウ",r1:"〇",r2:"〇",b:`消費者が購買のときにどれだけ考えるか（情報を探し、比べるか）は、場面によって違います。これを3つの**問題解決パターン**に分けます。

## 3つのパターン
- **拡大的（包括的）問題解決**：初めて買う、高価、失敗したくない商品のときに、たくさんの情報を集めてじっくり比べます。例：初めて買う車、住宅、パソコン
- **限定的問題解決**：その製品分野はある程度知っているが、新しいブランドや新製品を検討するときです。少しだけ情報を集めて判断します。例：いつもと違うシャンプーを試す、新発売のお菓子を選ぶ
- **日常的反応行動（習慣的問題解決）**：いつも買っている物を、ほとんど考えずに買います。例：毎日買うペットボトルのお茶、いつものトイレットペーパー

## 決める要因
- 購入経験が多いほど、考える量は減ります。
- 価格が高い、失敗のリスクが大きい、自分にとって重要（関与が高い）ほど、考える量は増えます。

## マーケティングへの活用
- 拡大的問題解決の商品：詳しい情報提供、店員の説明、比較資料が重要
- 日常的反応行動の商品：店頭で目立つこと、品切れさせないこと、他社に乗り換えられないことが重要。逆に競合は、試供品や値引きで習慣を崩そうとします。

## ポイント
例を読んで、どのパターンかを選ぶ問題が多いです。「経験の多さ」と「重要さ（関与）」で判断しましょう。`},
{n:28,u:"消費者行動",t:"消費者の商品選択の決定方略",a:"イ",r1:"✕",r2:"✕",b:`**決定方略**とは、消費者が複数の商品の中から1つを選ぶときに使う「ルール」のことです。大きく**補償型**と**非補償型**に分けられます。

## 補償型（代償型）
ある属性の弱点を、別の属性の長所で**埋め合わせできる**ルールです。
- **線形代償型**：各属性を点数化し、重要度をかけて合計し、合計点が最も高い商品を選びます。例：価格は少し高いが、性能とデザインが優れているので総合点で選ぶ。じっくり考えるときに使われ、頭の負担が大きい方法です。

## 非補償型（非代償型）
ある属性が悪ければ、他が良くても**埋め合わせできない**ルールです。簡単に決められます。
- **連結型**：すべての属性で**最低ラインを満たす**商品を選びます。1つでも基準以下ならアウト。例：「価格3万円以下、重さ1kg以下、電池8時間以上」を全部満たす物
- **分離型**：どれか1つの属性が**特に優れていれば**選びます。例：「カメラ性能がとにかく良ければ他は気にしない」
- **辞書編纂型**：最も重要な属性で一番良い物を選び、同点なら2番目に重要な属性で比べます。辞書の並び順と同じ考え方です。
- **EBA型（属性による排除型）**：重要な属性から順に、基準を満たさない商品を**消していき**、最後に残った物を選びます。

## 見分け方のコツ
- 「総合点」→ 線形代償型
- 「全部の条件を満たす」→ 連結型
- 「どれか1つが優れている」→ 分離型
- 「一番重要な属性で比べ、同じなら次の属性」→ 辞書編纂型
- 「条件に合わない物を順に除外」→ EBA型

## ポイント
連結型（ANDの考え方）と分離型（ORの考え方）の違い、辞書編纂型とEBA型の違い（一番を選ぶか、外れを消すか）が紛らわしく、よく問われます。`},
{n:29,u:"消費者行動",t:"消費者の商品に対するこだわりの強さ",a:"エ",r1:"〇",r2:"〇",b:`消費者が商品にどれだけこだわり、重要だと感じているかを**関与（インボルブメント）**といいます。

## 高関与と低関与
- **高関与**：その商品が自分にとって重要で、強い関心を持っている状態です。情報を積極的に集め、じっくり比べます。例：車、住宅、趣味のカメラ、ファッションにこだわる人の服
- **低関与**：その商品にあまり関心がなく、深く考えずに買う状態です。例：ティッシュ、洗剤、ボールペン

## 関与の種類
- **製品関与**：その製品そのものへの関心の強さ。例：コーヒー好きは、コーヒー豆への製品関与が高い
- **購買関与**：その時の買い物に対する関心の強さ。例：普段はこだわらないワインでも、大切な人への贈り物なら購買関与が高くなる

## 関与を高める要因
価格が高い、失敗のリスクが大きい、自分のイメージ（自己表現）に関わる、他人から見られる、などの場合に関与は高くなります。同じ商品でも、人や場面によって関与の高さは変わります。

## マーケティングへの活用
- 高関与の商品：詳しい性能情報や比較データ、専門的な説明が効果的
- 低関与の商品：ブランド名を覚えてもらう、くり返し広告を流す、店頭で目立たせるといった方法が効果的

## ポイント
関与の高さは、購買行動の類型（No.30）や精緻化見込みモデル（No.57）にもつながる重要な考え方です。`},
{n:30,u:"消費者行動",t:"消費者の購買行動の類型",a:"イ",r1:"✕",r2:"〇",b:`**アサエル**は、消費者の購買行動を**「関与の高さ」**と**「ブランド間の違いの大きさ」**の2つの軸で4つに分類しました。

## 4つの類型
- **複雑な購買行動**（高関与 × ブランド間の差が大きい）：じっくり情報を集め、比べてから買います。例：パソコン、車
- **不協和低減型購買行動**（高関与 × ブランド間の差が小さい）：高価で重要だが、どのブランドも似ているため、比較的早く決めます。そのぶん、買った後に「これで良かったのか」と不安（認知的不協和）を感じやすくなります。例：エアコン、カーペット
- **バラエティ・シーキング型購買行動**（低関与 × ブランド間の差が大きい）：特に不満はないのに、変化を楽しむために別のブランドを試します。例：お菓子、カップ麺
- **習慣的購買行動**（低関与 × ブランド間の差が小さい）：深く考えず、いつもの物を習慣で買います。例：塩、砂糖、トイレットペーパー

## 企業の対応
- 複雑な購買行動：製品の特徴や優れている点をしっかり伝える
- 不協和低減型：購入後のフォローや保証で安心させる
- バラエティ・シーキング：リーダー企業は棚を押さえて定番化、他社は値引きや試供品で試してもらう
- 習慣的購買行動：くり返しの広告で名前を覚えてもらい、店頭で目立たせる

## ポイント
4つの名前と2軸の組み合わせが最重要です。特に「高関与なのに差が小さい＝不協和低減型」と「低関与なのに差が大きい＝バラエティ・シーキング」を取り違えないよう注意しましょう。`},
{n:31,u:"消費者行動",t:"解釈レベル理論",a:"ウ",r1:"〇",r2:"✕",b:`**解釈レベル理論**とは、対象との**心理的距離**によって、人の物事のとらえ方（解釈のレベル）が変わるという理論です。

## 基本の考え方
- **心理的距離が遠い**とき → **高次レベル**の解釈：抽象的、本質的、「なぜ（Why）」「望ましさ」を重視
- **心理的距離が近い**とき → **低次レベル**の解釈：具体的、細かい、「どうやって（How）」「実現可能性」を重視

## 心理的距離の種類
- **時間的距離**：遠い未来か、近い未来か
- **空間的距離**：遠い場所か、近い場所か
- **社会的距離**：他人のことか、自分のことか
- **確率的距離（仮説性）**：起こりそうにないか、起こりそうか

## 具体例：旅行の計画
半年後の旅行を考えるときは「リフレッシュしたい」「美しい景色を見たい」と目的や魅力（望ましさ）を重視しますが、出発の前日になると「荷物をどう詰めるか」「駅まで何分かかるか」と具体的な手順（実現可能性）が気になります。

「遠い＝抽象的・望ましさ」「近い＝具体的・実現可能性」の組み合わせを押さえれば、ほとんどの問題に対応できます。`},
{n:32,u:"消費者行動",t:"マズローの欲求階層理論",a:"ア",r1:"✕",r2:"✕",b:`**マズローの欲求階層理論**は、心理学者**マズロー**が提唱したもので、人間の欲求は5つの階層になっており、**下の欲求がある程度満たされると、1つ上の欲求が現れる**という考え方です。

## 5つの欲求（下から順に）
- **① 生理的欲求**：食べる、眠る、呼吸するなど、生きるための基本的な欲求。例：お腹が空いたから食べ物が欲しい
- **② 安全の欲求**：危険から身を守り、安心して暮らしたい欲求。例：保険、防犯グッズ、安定した収入
- **③ 社会的欲求（所属と愛の欲求）**：集団に所属したい、仲間に受け入れられたい欲求。例：友人とのつながり、サークル、SNS
- **④ 承認の欲求（尊厳の欲求）**：他人から認められたい、尊敬されたい欲求。例：高級ブランド品、資格、表彰
- **⑤ 自己実現の欲求**：自分の能力を最大限に発揮し、なりたい自分になりたい欲求。例：趣味の習い事、自己啓発、創作活動

## 覚え方
下から「**生・安・社・承・自**（せい・あん・しゃ・しょう・じ）」。下の4つは足りないものを満たそうとする**欠乏欲求**、最上位の自己実現は成長を求める**成長欲求**とされます。

## マーケティングへの活用
同じ商品でも、どの欲求に訴えるかで売り方が変わります。例えば車なら、「安全性能」は安全の欲求、「家族で出かけられる」は社会的欲求、「高級車でステータスを示す」は承認の欲求に訴えています。

## ポイント
5つの**順番**と、具体例がどの階層に当たるかを選ぶ問題が多いです。特に「社会的欲求（仲間に入りたい）」と「承認の欲求（認められたい）」の違いに注意しましょう。`},
{n:33,u:"消費者行動",t:"準拠集団",a:"エ",r1:"〇",r2:"〇",b:`**準拠集団**とは、人が自分の考え方や行動を決めるときに、基準として参考にする集団のことです。家族、友人、職場、憧れの有名人のグループなどが当たります。

## 準拠集団の種類
- **所属集団**：実際に自分が所属している集団。例：家族、クラス、会社
- **願望集団（あこがれ集団）**：所属していないが、所属したいと憧れる集団。例：プロのスポーツ選手、人気モデル
- **拒否集団（分離集団）**：同じように見られたくないと避ける集団。その集団が使う物は避けようとします。

## 準拠集団の影響の種類
- **情報的影響**：詳しい人の意見を参考にします。例：「カメラに詳しい友人が勧めたから買う」
- **功利的影響（規範的影響）**：周りに合わせることで、ほめられたり、仲間外れを避けたりしようとします。例：「みんなが持っているから自分も買う」
- **価値表出的影響**：憧れの集団と同じ物を使うことで、自分をその集団に近づけようとします。例：「好きなスポーツ選手と同じシューズを履く」

## 影響が強い商品
人から**見られる物（公共的）**や、誰もが持っているわけではない**ぜいたく品**ほど影響が強くなります。例：腕時計やバッグは影響が強く、冷蔵庫の中の調味料は影響が弱くなります。

## ポイント
有名人を広告に起用するのは、願望集団としての影響（価値表出的影響）を利用したものです。`},
{n:34,u:"消費者行動",t:"プロスペクト理論",a:"イ",r1:"〇",r2:"〇",b:`**プロスペクト理論**は、**カーネマン**と**トベルスキー**が提唱した理論で、人は損得を合理的に判断しているわけではない、ということを示しています。行動経済学の代表的な理論です。

## 価値関数の3つの特徴
- **参照点依存性**：人は金額そのものではなく、**基準（参照点）からの変化**で損得を感じます。例：給料が30万円でも、前月が35万円なら「損した」と感じる
- **損失回避性**：同じ金額なら、**得をした喜びより、損をした悲しみの方が大きい**（約2倍といわれます）。例：1万円拾った喜びより、1万円落とした悲しみの方が大きい
- **感応度逓減性**：変化が大きくなるほど、感じ方は鈍くなります。例：0円→1万円の得は嬉しいが、100万円→101万円の得はそれほど嬉しくない

## 確率の感じ方
人は**低い確率を実際より高く**、**高い確率を実際より低く**感じる傾向があります。宝くじを買う（低い確率を過大評価）のはこのためです。

## マーケティングへの活用
- 「今買わないと損」「期間限定」：損失回避性を利用
- 「通常価格1万円→今だけ7千円」：参照点を示して得を感じさせる
- 「30日間返金保証」：損をする不安を減らす
- 同じ内容でも「脂肪分20%」より「赤身80%」の方が好まれる（フレーミング効果）

## ポイント
「損失回避性＝損の方が強く感じる」が最も重要です。`},
{n:35,u:"製品戦略",t:"消費者の購買習慣と製品分類",a:"ウ",r1:"〇",r2:"〇",b:`消費財は、消費者がどのように買うか（購買習慣）によって、主に3つに分類されます（**コープランド**の分類）。

## 3つの製品分類
- **最寄品**：よく買い、あまり比べずに、近くの店ですぐ買う商品です。価格は安めで、買う頻度が高いです。例：飲み物、パン、洗剤、ティッシュ、新聞
- **買回品**：いくつかの店を回って、品質・価格・デザインなどを比べてから買う商品です。例：洋服、家具、家電、靴
- **専門品**：特定のブランドに強いこだわりがあり、そのためなら遠くの店まで行ったり、手間をかけたりしてでも買う商品です。例：高級ブランドのバッグ、高級車、特定の職人の楽器

（これに加えて、消費者がふだん探そうとしない**非探索品**（例：保険、墓石）を挙げることもあります。）

## マーケティングへの影響
- **最寄品**：どこでも買えることが大切なので、多くの店に置く（**開放的チャネル**）。広告で名前を覚えてもらいます。
- **買回品**：比べられる場所が大切なので、ある程度選んだ店に置く（**選択的チャネル**）。店員の説明も重要です。
- **専門品**：ブランドイメージを守るため、特定の店だけで売る（**排他的チャネル**）。

## ポイント
同じ商品でも、人によって分類が変わることがあります。コーヒー豆は多くの人には最寄品ですが、こだわりの強い人には専門品です。チャネル戦略（No.66）とセットで覚えましょう。`},
{n:36,u:"製品戦略",t:"製品ミックス",a:"エ",r1:"✕",r2:"〇",b:`**製品ミックス**とは、ある企業が販売している**すべての製品の組み合わせ**のことです。製品ミックスは次の言葉で表されます。

## 基本用語
- **製品ライン**：機能や顧客、販売方法などが似ている製品のまとまりです。例：化粧品会社の「スキンケアライン」「メイクアップライン」「ヘアケアライン」
- **製品アイテム**：1つ1つの具体的な商品です。サイズや色、容量違いなども別のアイテムになります。

## 製品ミックスの4つの次元
- **幅**：製品ラインの**数**。例：スキンケア・メイク・ヘアケアの3ラインなら幅は3
- **深さ**：1つの製品ラインの中のアイテムの**種類の数**（バリエーション）。例：ある化粧水に「しっとり」「さっぱり」×「大・小」があれば深さは4
- **長さ**：すべての製品ラインに含まれるアイテムの**合計数**
- **整合性（一貫性）**：製品ライン同士が、用途や生産方法、流通経路などの点でどれだけ関連しているか

## 戦略の考え方
- **幅を広げる**：新しい製品ラインを追加し、事業を広げます。例：食品会社が健康食品ラインを追加
- **深さを深める**：味やサイズなどのバリエーションを増やし、多様なニーズに応えます。
- **整合性を高める**：ブランドイメージや販売チャネルを共有しやすく、効率が良くなります。

## ポイント
「幅＝ラインの数（横）」「深さ＝ラインの中の種類（縦）」の違いが最もよく問われます。`},
{n:37,u:"製品戦略",t:"製品開発の先発者と後発者",a:"エ",r1:"〇",r2:"✕",b:`新しい製品分野に最初に参入する企業を**先発者（パイオニア）**、後から参入する企業を**後発者**といいます。それぞれに有利な点があります。

## 先発者の優位（先発優位）
- **技術のリーダーシップ**：技術や経験を先に積み、特許も取れる
- **希少な資源の先取り**：良い立地、原材料、販売チャネル、優秀な人材を先に押さえられる
- **スイッチング・コスト**：顧客が使い慣れると、他社に乗り換えにくくなる
- **ブランドの認知**：「その分野＝このブランド」と覚えてもらいやすい。例：「ウォークマン」「ポストイット」
- **製品の標準（基準）を決められる**：消費者の評価基準を自社に有利な形で作れる

## 後発者の優位（後発優位）
- **ただ乗り（フリーライド）**：先発者が費用をかけた技術開発や市場の教育（商品の説明）の成果を利用できる
- **不確実性の解消**：市場が本当に伸びるか、顧客が何を求めているかを見てから参入できる
- **変化への対応**：技術や顧客のニーズが変わったとき、新しい技術で参入できる
- **先発者の慣性**：先発者は既存の設備や製品にとらわれ、変化に対応しにくい

## 具体例
スマートフォンでは、先に携帯電話市場を持っていた企業より、後から参入したAppleが大きな成功を収めました。後発でも、先発者の課題を解決すれば勝てる例です。

## ポイント
どの項目が先発優位で、どれが後発優位かを区別する問題が多いです。「市場の不確実性がわかってから参入できる」は後発優位です。`},
{n:38,u:"製品戦略",t:"新製品開発の手順",a:"ウ",r1:"〇",r2:"〇",b:`新製品開発は、一般に次のような段階を順番に進めます。各段階で「次に進むか、やめるか」を判断し、失敗のリスクを減らします。

## 新製品開発の流れ
- **① アイデアの創出**：顧客の声、社員、研究開発部門、競合、取引先などから、たくさんのアイデアを集めます。
- **② スクリーニング（ふるい分け）**：集めたアイデアを評価し、見込みのあるものに絞ります。良いアイデアを捨てる誤りや、悪いアイデアを進める誤りに注意します。
- **③ コンセプト開発とテスト**：アイデアを、顧客にとっての価値がわかる具体的な製品コンセプトにし、ターゲット顧客の反応を調べます。
- **④ マーケティング戦略の立案**：ターゲット、ポジショニング、価格、流通、販促の方針、売上目標などを決めます。
- **⑤ 事業性の分析**：売上、コスト、利益の見込みを計算し、事業として成り立つかを判断します。
- **⑥ 製品開発**：試作品を作り、機能や安全性のテストを行います。
- **⑦ テスト・マーケティング**：一部の地域や店舗で実際に売ってみて、反応を確かめます。
- **⑧ 市場導入（商品化）**：本格的に発売します。発売の時期や場所を決めます。

## ポイント
試験では**順番**がよく問われます。特に「コンセプトのテスト → マーケティング戦略 → 事業性の分析 → 製品開発」の順番を間違えやすいので注意しましょう。お金のかかる試作品作り（製品開発）の前に、コンセプトや採算をしっかり確認する、と理解すると覚えやすくなります。`},

{n:39,u:"製品戦略",t:"新製品開発のアプローチ",a:"ア",r1:"〇",r2:"〇",b:`新製品を開発するときの出発点の違いによって、大きく2つのアプローチがあります。

## 2つのアプローチ
- **ニーズ志向（マーケット・イン）**：顧客のニーズや市場の声から出発して、それに合う製品を開発します。売れる見込みが立てやすい一方で、顧客が言葉にできる範囲のニーズにとどまり、画期的な製品は生まれにくい面があります。例：「片手で開けやすいふたが欲しい」という声から容器を改良する
- **シーズ志向（プロダクト・アウト）**：企業が持つ技術や素材（シーズ＝種）から出発して、それを活かせる製品を開発します。顧客が想像もしなかった画期的な製品が生まれる可能性がありますが、売れるかどうかのリスクは大きくなります。例：失敗作の弱い接着剤から「ポストイット」が生まれた

## 両方を組み合わせることが大切
実際の開発では、技術（シーズ）と顧客のニーズを結びつけることが重要です。技術があっても使い道（ニーズ）がなければ売れず、ニーズがわかっても実現する技術がなければ作れません。

## 開発の進め方
- **リレー型（逐次型）**：企画→設計→生産→販売と部門ごとに順番に進めます。管理しやすいが時間がかかります。
- **ラグビー型（同時並行型、コンカレント・エンジニアリング）**：複数の部門が最初から一緒にチームを組み、作業を同時に進めます。開発期間を短くできます。

## ポイント
「顧客の声から＝マーケット・イン（ニーズ志向）」「自社の技術から＝プロダクト・アウト（シーズ志向）」の区別が基本です。`},
{n:40,u:"製品戦略",t:"製品ライフ・サイクル",a:"ウ",r1:"〇",r2:"〇",b:`**製品ライフ・サイクル（PLC）**とは、製品が市場に出てから消えるまでの売上と利益の変化を、人の一生にたとえて4つの段階で表したものです。

## 4つの段階
- **導入期**：発売したばかりで、製品があまり知られていません。売上は少なく、開発費や広告費がかかるため、**利益は赤字**のことが多いです。競合はほとんどいません。
- **成長期**：製品が知られて**売上が急速に伸び**、利益も出始めます。成長を見た競合が次々と参入してきます。
- **成熟期**：多くの人に行き渡り、**売上の伸びが止まり**ます。売上は最大ですが、競争が最も激しくなり、価格競争も起きます。多くの製品はこの段階が最も長くなります。
- **衰退期**：新しい技術や代替品の登場、好みの変化などで**売上も利益も減少**します。撤退する企業が出てきます。

## 具体例：音楽の聴き方
CDは成熟期から衰退期へ、音楽ストリーミングは成長期から成熟期へ、と移ってきました。

## 注意点
- すべての製品がこの形をたどるわけではなく、期間の長さもさまざまです。
- 成熟期でも、新しい使い方の提案やリニューアルで売上を再び伸ばすことができます（**ライフサイクルの延長**）。

## ポイント
各段階の「売上・利益・競合の数・顧客のタイプ」の特徴がよく問われます。利益が最大になるのは成長期の終わりから成熟期にかけて、売上が最大になるのは成熟期です。`},
{n:41,u:"製品戦略",t:"製品ライフ・サイクルとマーケティング・ミックス",a:"ウ",r1:"✕",r2:"〇",b:`製品ライフ・サイクルの段階によって、適したマーケティング・ミックス（4P）は変わります。

## 導入期：製品を知ってもらう
- 製品：基本的な機能に絞ったシンプルな製品
- 価格：上澄み吸収価格（高め）または市場浸透価格（低め）
- 流通：限られた店で販売（選択的）
- 販促：製品の存在と使い方を知らせる広告、試供品で試してもらう

## 成長期：シェアを広げる
- 製品：品質の向上、機能やバリエーションの追加
- 価格：市場に浸透させるため、価格を少し下げることも
- 流通：販売店を増やす（開放的）
- 販促：自社ブランドを選んでもらうための広告（ブランド選好の形成）

## 成熟期：シェアを守り、差をつける
- 製品：ブランドやモデルを多様化し、競合と差別化
- 価格：競合に対抗した価格、値引き
- 流通：さらに広く、徹底して店頭に並べる
- 販促：他社との違いを強調、他社からの乗り換えを促す販売促進

## 衰退期：効率よく利益を回収
- 製品：売れない製品やアイテムを整理・撤退
- 価格：値下げ
- 流通：採算の悪い販売店を減らす（選択的に戻す）
- 販促：最低限に減らす

## ポイント
「導入期＝知ってもらう」「成長期＝選んでもらう」「成熟期＝違いを示す・守る」「衰退期＝絞り込む」という目的の流れで覚えると、各段階の4Pが自然に思い出せます。`},
{n:42,u:"製品戦略",t:"ファッド",a:"エ",r1:"✕",r2:"〇",b:`製品やデザインの流行には、その広まり方と続く期間によって、**スタイル・ファッション・ファッド**の3つのパターンがあります。

## 3つのパターン
- **スタイル**：基本的な表現の形式で、一度生まれると何世代にもわたって長く続き、人気が上がったり下がったりをくり返します。例：住宅の和風・洋風、服のフォーマル・カジュアル
- **ファッション**：ある時期に広く受け入れられ、人気のあるスタイルです。ゆっくり広まり、しばらく続き、ゆっくり消えていきます。例：ある年代に流行した服装
- **ファッド**：**急速に広まり、すぐにピークに達し、急速に消えていく**一時的なブームです。限られた人たちの間で熱狂的に流行することが多く、短命です。例：一時的に大流行したタピオカドリンクのブーム、ハンドスピナー、特定の一発ギャグ

## ファッドの特徴
- 生活上の大切なニーズを満たすものではなく、目新しさや話題性が中心
- 製品ライフ・サイクルのグラフが、鋭い山の形になる
- 長続きしないので、企業は大きな設備投資をすると、ブームが去った後に損失を抱えやすい

## マーケティングへの活用
ファッドの商品では、ブームの間に素早く売り、早めに撤退することが大切です。

## ポイント
3つの中で「急に流行って急に消える」のがファッドです。スタイル（長く続く基本形）、ファッション（ゆっくり広まりゆっくり消える）との違いを押さえましょう。`},
{n:43,u:"製品戦略",t:"ブランド・アイデンティティ",a:"イ",r1:"〇",r2:"〇",b:`**ブランド・アイデンティティ**とは、企業が「自社のブランドを顧客にどのように認識してほしいか」という、**企業側が目指すブランドの姿**のことです。

## ブランド・イメージとの違い
- **ブランド・アイデンティティ**：企業が**こう思われたい**というブランドの理想像（送り手側）
- **ブランド・イメージ**：顧客が**実際にどう思っているか**というブランドの印象（受け手側）

ブランド戦略では、アイデンティティとイメージを一致させることを目指します。

## アーカーによる4つの視点
ブランド研究者の**アーカー**は、ブランド・アイデンティティを4つの視点から考えることを提案しました。
- **製品としてのブランド**：製品の分野、品質、使い方、原産国など。例：「ボルボ＝安全な車」
- **組織としてのブランド**：企業の姿勢、革新性、社会への貢献など
- **人としてのブランド**：ブランドを人にたとえたときの性格（ブランド・パーソナリティ）。例：「若々しい」「誠実」「おしゃれ」
- **シンボルとしてのブランド**：ロゴ、キャラクター、色、歴史など

## ブランド要素
ブランドを識別させるための要素には、**ブランド名、ロゴ、シンボルマーク、キャラクター、スローガン、ジングル（音楽）、パッケージ**などがあります。

## ポイント
「アイデンティティ＝企業が目指す姿」「イメージ＝顧客が抱く印象」という、主語の違いがよく問われます。`},
{n:44,u:"製品戦略",t:"イノベーション普及理論",a:"ウ",r1:"〇",r2:"〇",b:`**イノベーション普及理論**は、**ロジャーズ**が提唱したもので、新しい製品やアイデアが社会に広まっていく過程を、採用する時期によって5つのグループに分けて説明しています。

## 5つの採用者カテゴリー
- **イノベーター（革新者）**：約2.5%。新しいものが大好きで、リスクを恐れず最初に試します。
- **アーリー・アダプター（初期採用者）**：約13.5%。流行に敏感で、周りへの影響力が大きい**オピニオン・リーダー**。普及のカギを握ります。
- **アーリー・マジョリティ（前期多数派）**：約34%。慎重だが、平均より少し早く採用します。
- **レイト・マジョリティ（後期多数派）**：約34%。疑い深く、周りの多くが使い始めてから採用します。
- **ラガード（遅滞者）**：約16%。伝統を重んじ、最後まで採用しないことも多い人たちです。

## 普及を早める製品の5つの特性
- **相対的優位性**：今までの物より優れているか
- **両立性（適合性）**：今の生活習慣や価値観に合っているか
- **複雑性**：わかりやすく使いやすいか（複雑だと普及が遅い）
- **試用可能性**：気軽に試せるか
- **観察可能性**：使っている様子や効果が他人から見えるか

## キャズム
**ムーア**は、アーリー・アダプターとアーリー・マジョリティの間に大きな溝（**キャズム**）があると指摘しました。新しさを好む人と、実用性や安心感を重視する人では求めるものが違うため、ここを越えられずに消える製品が多いのです。

## ポイント
5つのカテゴリーの**順番と割合**、普及を早める5つの特性がよく問われます。`},
{n:45,u:"価格戦略",t:"価格の特徴",a:"ウ",r1:"〇",r2:"〇",b:`価格は4Pの1つですが、他の3つ（製品・流通・プロモーション）とは違う特徴を持っています。

## 価格の主な特徴
- **唯一、収益を生む要素**：製品開発・流通・プロモーションはお金がかかる（コスト）要素ですが、価格は企業に売上・利益をもたらす唯一の要素です。
- **変更が簡単で、効果がすぐ出る**：製品の改良や流通網の整備には時間がかかりますが、価格は比較的すぐに変えられ、売上への効果もすぐに表れます。
- **競合に真似されやすい**：値下げはすぐに競合に追随されやすく、価格競争（値下げ合戦）に陥ると業界全体の利益が下がります。
- **一度下げると戻しにくい**：値下げした価格に顧客が慣れると、元の価格に戻したときに「値上げ」と感じられ、売上が落ちやすくなります。
- **品質やブランドのイメージに影響する**：価格は「品質の手がかり」としても受け取られます。安すぎると品質を疑われ、ブランドイメージを傷つけることがあります。

## 具体例
飲食チェーンが期間限定の値下げで客数を増やしても、競合も値下げすると、どちらも利益が減るだけになることがあります。

## ポイント
「価格は即効性があるが、競合に真似されやすく、戻しにくい」という両面を理解しておきましょう。価格以外の要素で差をつける**非価格競争**が重視されるのはこのためです。`},
{n:46,u:"価格戦略",t:"新製品の価格決定戦略",a:"イ",r1:"〇",r2:"〇",b:`新製品を発売するときの価格の決め方には、大きく2つの戦略があります。

## 上澄み吸収価格戦略（スキミング・プライシング）
最初は**高い価格**をつけ、価格にこだわらない層（新しいもの好きや高所得層）から大きな利益を得ます。その後、段階的に値下げして、より多くの顧客に広げていきます。「上澄み」をすくい取るイメージです。
- 向いている条件：
  - 製品に独自性があり、競合がすぐには参入できない（特許など）
  - 高くても買う顧客が十分にいる
  - 開発費を早く回収したい
  - 高価格が高品質のイメージにつながる
- 例：最新のゲーム機やスマートフォン、新しい医薬品

## 市場浸透価格戦略（ペネトレーション・プライシング）
最初から**低い価格**をつけ、一気に多くの顧客を獲得して高いシェアを取ります。
- 向いている条件：
  - 価格に敏感な顧客が多い（価格弾力性が高い）
  - 大量に作るとコストが下がる（規模の経済性・経験曲線効果が働く）
  - 低価格で競合の参入を防ぎたい
- 例：新しい日用品、新しいネットサービスの低価格プラン

## ポイント
「高く始めて徐々に下げる＝上澄み吸収」「最初から安くしてシェアを取る＝市場浸透」が基本です。どのような条件のときにどちらを選ぶか、がよく問われます。`},
{n:47,u:"価格戦略",t:"新製品の価格設定と企業の競争地位",a:"イ",r1:"〇",r2:"✕",b:`新製品の価格戦略（上澄み吸収価格か市場浸透価格か）は、その企業の**業界での立場（競争地位）**によっても選び方が変わります。

## 競争地位ごとの傾向
- **リーダー企業**：ブランド力や信頼があり、高い価格でも買ってもらいやすいため、**上澄み吸収価格**を取りやすい立場です。また、値下げ競争をすると自社の大きなシェアの利益が減ってしまうため、価格競争は避けようとします（非価格対応）。
- **チャレンジャー企業**：リーダーからシェアを奪うため、リーダーと違う価値で差別化します。その一つの手段として、**市場浸透価格**など低価格で攻めることもあります。
- **フォロワー企業**：開発費をかけずに模倣するため、コストが低く、**リーダーより安い価格**をつけて利益を確保します。
- **ニッチャー企業**：特定の市場で独自の価値を持つため、価格競争を避け、**高めの価格**を維持できることが多いです。

## 先発と後発の関係
- 新しい市場を最初に作った**先発企業**は、競合がいないうちに上澄み吸収価格で開発費を回収しやすいです。
- **後発企業**は、先発企業より安い価格をつけて参入し、シェアを奪うことが多くなります。

## ポイント
価格戦略は、製品の特徴だけでなく「自社がどの立場か」「競合がどう動くか」と合わせて決める、という考え方が大切です。市場地位別の競争戦略（No.16）と一緒に復習すると理解が深まります。`},
{n:48,u:"価格戦略",t:"規模の経済性",a:"エ",r1:"〇",r2:"〇",b:`**規模の経済性**とは、**生産量（事業の規模）が大きくなるほど、製品1個あたりのコストが下がる**ことです。

## なぜコストが下がるのか
- **固定費の分散**：工場の建物、機械、研究開発費などの固定費は、生産量が増えても変わりません。たくさん作るほど、1個あたりの固定費が小さくなります。例：固定費1,000万円で1万個作れば1個1,000円、10万個作れば1個100円
- **大量仕入れ**：原材料をまとめて買うと、安く仕入れられます。
- **専門化・効率化**：大規模になると、作業を分担して効率を上げられます。

## 似た考え方との違い
- **経験曲線効果**：**累積生産量（これまでに作った合計）**が増えるほど、作業に慣れたり工夫したりして、コストが下がる効果です。累積生産量が2倍になると、コストが一定の割合（20〜30%程度）下がるといわれます。規模の経済性が「一度にどれだけ作るか」なのに対し、経験曲線効果は「これまでにどれだけ作ってきたか」に注目します。
- **範囲の経済性**：**複数の事業や製品**で設備や技術、ブランドなどを共有することで、コストが下がる効果です。例：同じ工場で複数の商品を作る

## マーケティングへの影響
規模の経済性が働く業界では、**市場浸透価格**で安く売ってシェアを取り、大量生産でコストを下げる戦略が有効です。また、規模の経済性は新規参入の障壁にもなります。

## ポイント
規模の経済性・経験曲線効果・範囲の経済性の違いが問われやすいので、「規模＝量」「経験＝累積」「範囲＝種類」と区別しましょう。`},
{n:49,u:"価格戦略",t:"価格弾力性",a:"ウ",r1:"〇",r2:"✕",b:`**価格弾力性（需要の価格弾力性）**とは、価格が変わったときに、**需要量（売れる数）がどれだけ変わるか**を表す指標です。

## 計算式
**価格弾力性 ＝ 需要量の変化率 ÷ 価格の変化率**（通常は絶対値で考えます）

例：価格を10%下げたら、販売数が20%増えた → 20 ÷ 10 ＝ **2**

## 弾力性の大きさの意味
- **弾力性が1より大きい（弾力的）**：価格の変化に敏感に反応します。値下げすると販売数が大きく増え、**売上金額も増えます**。例：ぜいたく品、外食、代わりの商品が多い物
- **弾力性が1より小さい（非弾力的）**：価格が変わっても需要はあまり変わりません。値下げしても販売数はあまり増えず、**売上金額は減ります**。逆に値上げすると売上金額は増えます。例：米、塩、電気、医薬品などの生活必需品

## 弾力性が大きくなる条件
- 代わりになる商品（代替品）が多い
- ぜいたく品である
- 収入に対して支出の割合が大きい
- 購入をすぐに先延ばしにできる

## 具体例
ある銘柄の缶コーヒーは、他の銘柄にすぐ乗り換えられるので弾力性が大きい。一方、毎日必要なトイレットペーパーは、少し値上がりしても買う量はあまり変わらないので、弾力性が小さくなります。

## ポイント
「弾力的なら値下げで売上金額が増える、非弾力的なら値下げで売上金額が減る」という関係がよく問われます。計算問題も出るので、式を覚えておきましょう。`},
{n:50,u:"価格戦略",t:"消費者から見た価格の役割",a:"ア",r1:"✕",r2:"✕",b:`消費者にとって価格には、「お金を払う負担」という面だけでなく、いくつかの役割があります。

## 価格の2つの側面
- **支出（犠牲）としての価格**：商品を手に入れるために払う**負担**です。この面では、安いほど嬉しく感じます。
- **情報としての価格**：商品の**品質や価値を判断する手がかり**です。この面では、高いことがプラスに働くこともあります。

## 情報としての価格の役割
- **品質のバロメーター**：品質を自分で判断しにくい商品では、「高い＝品質が良い」と判断されやすくなります。例：ワイン、化粧品、サプリメント
- **威光（プレステージ）**：高い価格そのものが、ステータスや自己表現の手段になります。例：高級ブランドのバッグ。安くするとかえって売れなくなることがあり、このような価格を**威光価格（名声価格）**といいます。

## 参照価格
消費者が価格を判断するときの**ものさし**になる価格です。
- **内的参照価格**：過去の購入経験などから、消費者が頭の中に持っている「このくらいだろう」という価格
- **外的参照価格**：店頭で示される「通常価格」「メーカー希望小売価格」など。「通常1,000円→今だけ700円」という表示は、外的参照価格を使って得だと感じさせています。

## 心理的な価格設定の例
- **端数価格**：980円のように、切りのいい数字より少し低くして安く感じさせる
- **慣習価格**：缶ジュースのように、長く続いた価格が定着しているもの。変えると売上に大きく影響します。

## ポイント
「価格は負担であると同時に、品質を判断する手がかりでもある」という二面性が最重要です。`},
{n:51,u:"価格戦略",t:"価格設定のアプローチ",a:"イ",r1:"✕",r2:"✕",b:`価格の決め方は、何を基準にするかによって、主に3つのアプローチに分けられます。

## ① コスト志向の価格設定
**かかったコスト**を基準に価格を決めます。
- **コストプラス法**：製造コストに、一定の利益（マージン）を上乗せします。例：コスト800円＋利益200円＝1,000円
- **マークアップ法**：仕入れ値に一定の割合を上乗せします。小売業でよく使われます。
- **目標利益（損益分岐点）法**：目標とする利益を得るために必要な価格と販売量を計算して決めます。

計算が簡単ですが、顧客がその価格で買ってくれるかを考えていない、という弱点があります。

## ② 需要志向（顧客志向）の価格設定
**顧客がどれくらいの価値を感じるか**を基準に決めます。
- **知覚価値価格設定**：顧客が感じる価値に合わせて決めます。例：同じコーヒーでも、景色の良いホテルのラウンジでは高くても売れる
- **需要価格差別（差別価格）**：同じ商品でも、顧客・時間・場所によって価格を変えます。例：学割、映画のレディースデー、ホテルの平日料金と休日料金

## ③ 競争志向の価格設定
**競合の価格**を基準に決めます。
- **実勢価格設定（追随価格）**：業界の平均価格や、リーダー企業の価格に合わせます。例：ガソリンスタンド
- **入札価格設定**：公共工事の入札などで、競合がつける価格を予想して決めます。

## ポイント
例を読んで、どのアプローチかを答える問題が多いです。「コストに上乗せ＝コスト志向」「顧客の感じる価値＝需要志向」「他社の価格に合わせる＝競争志向」と覚えましょう。`},
{n:52,u:"コミュニケーション戦略",t:"企業のコミュニケーション戦略と消費者の反応",a:"ウ",r1:"〇",r2:"〇",b:`企業が広告などで情報を発信したとき、消費者がどのような段階を経て購入に至るかを表したモデルを**反応プロセス・モデル（効果階層モデル）**といいます。

## 基本の考え方
消費者の反応は、大きく次の3段階で進むと考えられます。
- **認知段階**：商品を知る、理解する
- **感情段階**：興味を持つ、好きになる、欲しいと思う
- **行動段階**：購入する

## 代表的なモデル
- **AIDMA（アイドマ）**：テレビや新聞などのマスメディア時代のモデルです。
  - **A**ttention（注意）→ **I**nterest（関心）→ **D**esire（欲求）→ **M**emory（記憶）→ **A**ction（行動）
- **AISAS（アイサス）**：インターネット時代のモデルです。
  - **A**ttention（注意）→ **I**nterest（関心）→ **S**earch（検索）→ **A**ction（行動）→ **S**hare（共有）
  - ネットで調べ、購入後にSNSなどで感想を共有する行動が加わっています。
- **AIDA**：Attention → Interest → Desire → Action（記憶を含まない基本形）

## マーケティングへの活用
消費者がどの段階にいるかによって、伝えるべき内容が変わります。
- 知らない人には：まず注目を集める広告
- 興味がある人には：詳しい情報や魅力を伝える
- 迷っている人には：限定セールや試供品で背中を押す
- 購入した人には：SNSでの共有を促す

## ポイント
AIDMAとAISASの各段階の英語と順番、特にAISASで加わった「Search（検索）」と「Share（共有）」がよく問われます。`},
{n:53,u:"コミュニケーション戦略",t:"企業のプロモーションによるコミュニケーション効果",a:"イ",r1:"〇",r2:"〇",b:`企業が消費者に情報を伝える手段の組み合わせを**プロモーション・ミックス**といいます。主に次の4つがあり、それぞれ効果の出方が違います。

## プロモーション・ミックスの4要素
- **広告**：テレビ、新聞、雑誌、ネットなどの媒体に**お金を払って**、企業名を明らかにして出すメッセージです。一度に多くの人に届き、ブランドのイメージ作りに向いています。ただし一方通行で、費用総額は大きくなります。

## 直接流通と間接流通

## ② 不確実性プールの原理（集中貯蔵の原理）

{n:63,u:"チャネル戦略",t:"HHI",a:"エ",r1:"✕",r2:"〇",b:`**HHI（ハーフィンダール・ハーシュマン指数）**は、ある市場で**少数の企業にどれだけシェアが集中しているか（市場集中度）**を表す指標です。

## 計算例

- 20² ＝ 400

- **HHI ＝ 1,600 ＋ 900 ＋ 400 ＋ 100 ＝ 3,000**

## 値の意味
- **最大値は10,000**：1社が100%を占める**独占**の状態（100² ＝ 10,000）
- **値が大きいほど**、少数の企業にシェアが集中しています（寡占的）。

{n:64,u:"チャネル戦略",t:"製造業のチャネル戦略",a:"イ",r1:"〇",r2:"〇",b:`メーカーが商品をどれだけ多くの販売店で扱ってもらうか、という**チャネルの開放度**によって、3つのチャネル戦略に分けられます。

## 3つのチャネル戦略
- **開放的チャネル（集約的チャネル）**：できるだけ**多くの販売店**で扱ってもらう戦略です。消費者がいつでもどこでも買えるようにします。
  - 長所：多くの消費者に届き、売上を広げやすい
  - 短所：販売店をコントロールしにくく、値引き競争が起きやすい
  - 例：飲料、お菓子、洗剤など
- **選択的チャネル**：一定の条件（販売力、立地、信用など）を満たす**選ばれた販売店**だけで扱ってもらう戦略です。
  - 長所：ある程度の広がりと、販売店へのコントロールの両方が得られる
  - 例：家電、衣料品、化粧品の一部
- **排他的チャネル（専属的チャネル）**：特定の地域で**1つ（または少数）の販売店だけ**に販売権を与え、その店には競合の商品を扱わせない戦略です。
  - 長所：販売方法や価格、ブランドイメージをしっかりコントロールできる。販売店も熱心に売ってくれる
  - 短所：販売の広がりは限られる
  - 例：自動車ディーラー、高級ブランド品

## 選び方のポイント
- 広く売りたい・日常的に買われる商品 → 開放的
- ブランドイメージや専門的な説明・サービスが大切な商品 → 排他的

{n:65,u:"チャネル戦略",t:"チャネル構造",a:"エ",r1:"✕",r2:"✕",b:`**チャネル構造**とは、流通チャネルがどのような形になっているかということで、主に**長さ・幅**などで表されます。

## チャネルの長さと幅
- **チャネルの長さ**：メーカーから消費者までの間に入る**段階の数**です。卸売業者が何段階も入れば「長い」、直接販売なら「短い」チャネルです。
- **チャネルの幅**：各段階で取引する**業者の数**です。多くの小売店と取引すれば「広い」、少数なら「狭い」チャネルです（開放的・選択的・排他的チャネルの違い）。

## 長いチャネルと短いチャネル
- **長いチャネル**：多くの小売店に届けやすく、物流や在庫の負担を卸売業者に任せられますが、メーカーの管理は行き届きにくくなります。日用品や食品など、多くの店で売る商品に多く見られます。
- **短いチャネル**：メーカーが販売方法や価格をコントロールしやすく、顧客の情報も得やすいですが、メーカーの負担は大きくなります。高価な商品や専門的な説明が必要な商品に多く見られます。

## 垂直的マーケティング・システム（VMS）
メーカー・卸売・小売が、バラバラに動くのではなく、**1つのシステムとしてまとまって動く**チャネルです。
- **企業型VMS**：1つの企業が、生産から販売までを**所有**して統合します。例：ユニクロのSPA（製造小売）
- **契約型VMS**：別々の企業が**契約**で結びつきます。例：**フランチャイズ・チェーン**（コンビニなど）、**ボランタリー・チェーン**（独立した小売店が集まって共同仕入れ）
- **管理型VMS**：所有や契約ではなく、大きな力を持つ企業（メーカーなど）が**影響力**で他の企業をまとめます。例：大手メーカーによる系列化

## ポイント
VMSの3つの型（企業型・契約型・管理型）の区別がよく問われます。「所有＝企業型」「契約＝契約型」「影響力＝管理型」と覚えましょう。`},
{n:66,u:"チャネル戦略",t:"製品分類とチャネルの開放度",a:"ア",r1:"✕",r2:"〇",b:`消費者がどのように買うかによる**製品分類（最寄品・買回品・専門品）**と、**チャネルの開放度（開放的・選択的・排他的）**には、次のような対応関係があります。

## 対応関係
- **最寄品 → 開放的チャネル**
  - 最寄品は、よく買い、近くの店で手間をかけずに買う商品です。
  - 消費者は「この店になければ別の商品を買う」ので、**できるだけ多くの店に置く**ことが重要です。
  - 例：飲料、お菓子、ティッシュは、コンビニ、スーパー、ドラッグストアなど、あらゆる店に置かれています。
- **買回品 → 選択的チャネル**
  - 買回品は、いくつかの店を回って比べてから買う商品です。
  - 比べやすく、説明もできる、**ある程度選ばれた店**に置きます。
  - 例：洋服、家電、家具は、専門店や大型店など、一定の条件を満たした店で売られています。
- **専門品 → 排他的チャネル**
  - 専門品は、特定のブランドにこだわり、遠くまで出かけてでも買う商品です。
  - 店が少なくても消費者は来てくれるので、**ブランドイメージを守るため、限られた店だけ**で売ります。
  - 例：高級ブランドのバッグは直営店や正規取扱店、高級車は正規ディーラーだけで売られています。

## 理由をつかむ
消費者が「買うためにどれだけ手間をかけてくれるか」がポイントです。
- 手間をかけない → 店を増やして近くに置く（開放的）
- 手間をかけてくれる → 店を絞ってブランドを守る（排他的）

## ポイント

{n:67,u:"チャネル戦略",t:"製造業者と流通業者の対立",a:"ウ",r1:"✕",r2:"✕",b:`メーカー（製造業者）と、卸売業者・小売業者（流通業者）は協力し合う関係ですが、目的が違うため、**対立（チャネル・コンフリクト）**が起きることがあります。

## なぜ対立が起きるのか
- **目標の違い**：メーカーは「自社の商品を高く、たくさん売りたい」。小売業者は「店全体の売上や利益を上げたい」「どのメーカーの商品でもいいから、客が集まる安い商品を売りたい」。
- **役割や権限の不明確さ**：価格を誰が決めるのか、販促費を誰が負担するのか、などがはっきりしない。
- **認識の違い**：市場の見方や、売れる商品についての考え方が違う。

## 対立の種類
- **垂直的コンフリクト**：チャネルの**異なる段階**の間の対立です。例：メーカーと小売業者の間で、価格や取引条件をめぐる対立
- **水平的コンフリクト**：チャネルの**同じ段階**の間の対立です。例：同じメーカーの商品を売る小売店同士の安売り競争
- **マルチチャネル間のコンフリクト**：メーカーが複数のチャネルを使うことで起きる対立です。例：メーカーが自社ネット通販で安く売り、既存の販売店が反発する

## 対立の具体例
- 大手小売業が力をつけて、メーカーに値下げや協賛金を求める
- 小売業者が、メーカーの商品より利益率の高い**プライベート・ブランド（PB）**を優先して売る
- メーカーの希望小売価格を無視して、小売店が大幅な値引き販売をする

## 対立を解決する方法
共通の目標を作る、話し合いや人材交流、契約で役割を明確にする、パワーを持つ側がまとめる（VMSなど）、などの方法があります。

## ポイント
「垂直的＝異なる段階」「水平的＝同じ段階」の区別がよく問われます。`},
{n:68,u:"チャネル戦略",t:"製造業者のパワーの源泉　パワー基盤",a:"イ",r1:"〇",r2:"✕",b:`チャネルの中で、ある企業が他の企業を自分の思うように動かす力を**パワー（影響力）**といいます。そのパワーがどこから来るか（**パワー基盤**）について、**フレンチ**と**レイブン**は5つに分類しました。

## 5つのパワー基盤
- **報酬パワー**：相手に**利益（ご褒美）を与えられる**ことによる力です。例：メーカーがリベートや販売奨励金、人気商品の優先的な供給を約束する
- **強制パワー**：相手に**罰（不利益）を与えられる**ことによる力です。例：「言うことを聞かなければ取引をやめる」「商品の供給を減らす」
- **正当性パワー（合法的パワー）**：契約や社会的な立場から、**相手が従うのが当然**と認められていることによる力です。例：フランチャイズ契約で、本部が加盟店に指示を出す権利
- **専門性パワー**：相手より**優れた知識や技術**を持っていることによる力です。例：メーカーが売場づくりや商品管理のノウハウを提供し、小売店がそれに従う
- **準拠パワー（同一化パワー）**：相手が**その企業に憧れたり、一体感を持ったりして**、自ら従おうとすることによる力です。例：有名ブランドを扱うことが小売店の誇りになり、そのブランドの方針に進んで従う

## 覚え方
- アメ（報酬）とムチ（強制）
- 当然の権利（正当性）
- 頼りになる知識（専門性）
- 憧れ・好意（準拠）

## ポイント
例を読んで、どのパワー基盤に当たるかを答える問題が多いです。特に「正当性（契約・立場）」と「準拠（憧れ・一体感）」、「専門性（知識）」の区別に注意しましょう。`},
{n:69,u:"チャネル戦略",t:"製造業者のパワーの源泉　取引依存度",a:"イ",r1:"〇",r2:"✕",b:`チャネルのパワーを考えるもう1つの見方が、**取引依存度**です。基本的な考え方は「**相手に頼っている（依存している）ほど、相手のパワーは強くなる**」というものです。

## 依存とパワーの関係
- A社がB社に大きく依存している（B社なしではやっていけない）とき、**B社はA社に対して強いパワー**を持ちます。
- 逆に、A社にとってB社の代わりがいくらでもいるなら、B社のパワーは弱くなります。

## 依存度を決める要因
- **取引の割合**：自社の売上（または仕入れ）のうち、その相手との取引が占める割合が大きいほど、相手への依存度は高くなります。
  - 例：小売店の売上の50%がA社の商品なら、小売店はA社に強く依存しています。
  - 例：メーカーの売上の60%が大手スーパーB社向けなら、メーカーはB社に強く依存しています。
- **代わりの取引相手がいるか**：他に取引できる相手が少ないほど、依存度は高くなります。
- **その取引の重要性**：その商品がないと客が来ない（人気ブランド）など、取引が重要であるほど依存度は高くなります。

## 具体例
以前はメーカーが強い力を持っていましたが、大手スーパーやコンビニチェーンが大きくなると、メーカーの売上の多くがその小売業者に集中しました。その結果、**メーカーが小売業者に依存する**ようになり、小売業者のパワーが強くなりました。

## パワーを強めるには
相手の自社への依存度を高める（人気商品を持つ、自社ならではの価値を提供する）、あるいは自社の相手への依存度を下げる（取引先を増やす）ことが有効です。

## ポイント
「依存している側が弱く、依存されている側が強い」という向きを間違えないようにしましょう。`},
{n:70,u:"サービスマーケティング",t:"サービス・スペクトラム",a:"エ",r1:"✕",r2:"〇",b:`**サービス・スペクトラム**は、**ショスタック**が示したもので、世の中の商品は「完全なモノ」と「完全なサービス」にはっきり分かれるのではなく、**有形（モノ）の要素と無形（サービス）の要素がさまざまな割合で組み合わさっている**ことを表したものです。

## スペクトラムの並び
商品を、有形の要素が強いものから無形の要素が強いものへと一直線に並べます。
- **有形要素が強い（モノ寄り）**：塩、清涼飲料、洗剤、自動車など
- **中間**：ファストフードなど（料理というモノと、調理・接客・店の雰囲気というサービスの両方が重要）
- **無形要素が強い（サービス寄り）**：航空輸送、投資管理、コンサルティング、教育、医療など

## ポイント
- 自動車のような「モノ」でも、販売時の説明、保証、点検・修理などのサービスが含まれています。
- 教育のような「サービス」でも、教科書や教室などのモノの要素が含まれています。
- つまり、**ほとんどの商品はモノとサービスの組み合わせ**で、その割合が違うだけ、という考え方です。

## マーケティングへの活用
- **有形要素が強い商品**は、品質や機能などを実物で示しやすいです。
- **無形要素が強い商品**は、目に見えず品質を事前に確かめにくいので、店舗の雰囲気、スタッフの身なり、資格の表示、口コミなど、**目に見える手がかり（有形化）**で信頼を伝えることが重要になります。

## ポイント
例を読んで、どの位置に当たるかを問う問題が多いです。ファストフードが**中間**に位置づけられる点はよく出ます。`},
{n:71,u:"サービスマーケティング",t:"サービスの基本特性",a:"ア",r1:"✕",r2:"✕",b:`サービスには、モノ（製品）とは違う**4つの基本特性**があります。マーケティングの考え方も、この特性に合わせて工夫する必要があります。

## 4つの基本特性
- **無形性**：サービスは形がなく、**買う前に見たり触ったり試したりできません**。例：美容院のカットは、終わるまで仕上がりがわからない
  - 対策：店の雰囲気、スタッフの身なり、資格、実績、口コミ、写真など、目に見える手がかりを示す
- **同時性（不可分性）**：サービスは、**作ること（生産）と使うこと（消費）が同時に起こります**。提供する人と受ける人を切り離せません。例：マッサージは、施術している間に受けている
  - 対策：スタッフの教育、顧客にも上手に参加してもらう工夫
- **異質性（変動性）**：サービスの品質は、**提供する人、時間、場所、顧客によってばらつきます**。例：同じ店でも、担当するスタッフや混雑具合でサービスの質が変わる
  - 対策：マニュアル化、研修で標準化する、機械化する
- **消滅性**：サービスは**保存（在庫）できません**。その時に使われなければ消えてしまいます。例：空席のまま出発した飛行機の座席、予約のない日のホテルの部屋
  - 対策：需要と供給を調整する（繁忙期と閑散期で価格を変える、予約制にする、閑散時に割引する）

## 覚え方
「**無・同・異・消**（む・どう・い・しょう）」。
- 見えない（無形性）
- 作りながら使う（同時性）
- 毎回ちがう（異質性）
- ためておけない（消滅性）

## ポイント
例を読んで、どの特性に当たるかを答える問題が多いです。特に「品質のばらつき＝異質性」と「在庫できない＝消滅性」を確実に押さえましょう。`},
{n:72,u:"サービスマーケティング",t:"サービスの基本特性(協働性)",a:"ウ",r1:"✕",r2:"〇",b:`**協働性（顧客参加）**とは、サービスは提供する側だけで作るのではなく、**顧客もサービスの生産に参加し、一緒に作り上げる**という特性です。サービスの**同時性**（生産と消費が同時）から生まれる特徴です。

## 具体例
- **学習塾・英会話**：先生の教え方が良くても、生徒が予習や宿題をしなければ成果は出ない
- **病院**：医師が正しく診断しても、患者が症状を正確に伝えず、薬を指示どおり飲まなければ治らない
- **フィットネスジム**：トレーナーの指導があっても、本人が続けなければ効果は出ない
- **美容院**：お客さんが希望をうまく伝えると、満足のいく髪型になりやすい
- **セルフサービス**：ファストフード店で客がトレイを片付ける、セルフレジで会計する、ATMでお金を引き出すなど、顧客が作業の一部を担当する

## なぜ重要か
- サービスの**品質や満足度は、顧客の参加の仕方によって変わります**。同じサービスでも、顧客の協力しだいで結果が大きく変わります。
- また、**他の顧客**もサービスに影響します。例：レストランで隣の席の客が騒がしいと、自分の満足度も下がる

## マーケティングへの活用
- 顧客に**役割をわかりやすく伝える**（使い方の説明、手順の案内）
- 顧客が参加しやすい仕組みを作る（わかりやすいセルフレジ、予約アプリ）
- 顧客同士の関係を整える（客層をそろえる、ルールを示す）

## ポイント
「顧客もサービスの**共同生産者**である」という考え方がキーワードです。`},
{n:73,u:"サービスマーケティング",t:"サービス・マーケティング戦略の基本類型",a:"ウ",r1:"✕",r2:"〇",b:`サービスはとても多様なため、サービスの性質によって分類し、それぞれに合ったマーケティング戦略を考えます。代表的なのが、**ラブロック**による分類です。

## ラブロックの分類
「**サービスの対象は何か（人か、モノか）**」と「**サービスの行為は有形か、無形か**」の2つの軸で、サービスを4つに分けます。
- **人の身体に向けた有形の行為**：顧客自身がその場にいる必要があります。例：美容院、病院の手術、旅客輸送、レストラン、ホテル
- **モノ（所有物）に向けた有形の行為**：顧客の持ち物に対して行います。顧客はその場にいなくてもよいことが多いです。例：車の修理、クリーニング、宅配便、ペットの診療
- **人の心（精神）に向けた無形の行為**：顧客の考えや気持ちに働きかけます。例：教育、コンサート、カウンセリング、放送
- **無形の資産（情報）に向けた無形の行為**：お金や情報などを扱います。例：銀行、保険、会計、法律相談

## 戦略への活用
- **人の身体に向けたサービス**：顧客が店舗に来るため、店の立地、雰囲気、待ち時間、スタッフの接客が満足度に直結します。
- **モノに向けたサービス**：顧客がその場にいないことも多いため、受け取りや返却の便利さ、作業の確実さが重要です。
- **心や情報に向けたサービス**：インターネットなどを使って、離れた場所からでも提供しやすくなります。

## ポイント
例を読んで、どの類型に当たるかを答える問題がよく出ます。使っている教科書によっては別の分類（顧客との接触の度合いや、カスタマイズの度合いによる分類など）で説明している場合もあるので、テキストの該当ページの図もあわせて確認してください。`},
{n:74,u:"サービスマーケティング",t:"サービス・エンカウンター",a:"エ",r1:"✕",r2:"✕",b:`**サービス・エンカウンター**とは、**顧客とサービス提供者（従業員など）が直接接する場面**のことです。サービスは同時性（生産と消費が同時）を持つため、この接点そのものがサービスの品質を決めます。

## 真実の瞬間
スカンジナビア航空（SAS）の社長だった**ヤン・カールソン**は、顧客が従業員と接する**最初の15秒ほど**の短い時間が、その会社全体の評価を決めると考え、これを「**真実の瞬間**」と呼びました。

例えば飛行機に乗る客は、予約の電話、空港のカウンター、搭乗口、機内の客室乗務員など、さまざまな従業員と短い時間ずつ接します。そのたびに顧客は「この会社は良い・悪い」と判断しています。

## なぜ重要か
- 顧客にとっては、接した従業員の対応が、そのまま**会社全体の印象**になります。
- どれだけ良い広告を出しても、エンカウンターでの対応が悪ければ、顧客の満足は得られません。
- サービス・エンカウンターでは、上司がその場にいないことが多く、**現場の従業員の判断**が重要になります。

## 企業の対応
- **従業員の教育**：接客の技術や心構えを身につけてもらう
- **権限委譲（エンパワーメント）**：現場の従業員に、その場で判断して対応できる権限を与える。例：クレームに対して、上司に確認せずにお詫びの品を出せる
- **マニュアル**：品質を一定に保つ。ただし、マニュアルだけに頼らず柔軟に対応することも大切です。

## ポイント
「顧客と従業員の接点」「真実の瞬間（ヤン・カールソン）」がキーワードです。サービス・トライアングル（No.76）のインタラクティブ・マーケティングとも関係しています。`},
{n:75,u:"サービスマーケティング",t:"サービス・プロフィット・チェーン",a:"イ",r1:"✕",r2:"〇",b:`**サービス・プロフィット・チェーン**は、**ヘスケット**らが提唱した考え方で、**従業員の満足が、顧客の満足を生み、それが企業の利益につながる**という、一連のつながり（連鎖）を示したものです。

## 連鎖の流れ
- **① 社内サービスの質**：働きやすい職場環境、教育制度、仕事の道具、正当な評価や報酬など、企業が従業員に提供する環境の質
- **② 従業員満足（ES）**：働く環境が良いと、従業員は仕事に満足します。
- **③ 従業員の定着と生産性**：満足した従業員は会社を辞めにくく、経験を積んで生産性が上がります。
- **④ サービスの価値**：経験豊富でやる気のある従業員は、質の高いサービスを提供します。
- **⑤ 顧客満足（CS）**：良いサービスを受けた顧客は満足します。
- **⑥ 顧客ロイヤルティ**：満足した顧客は、くり返し利用し、他の人にも勧めてくれます。
- **⑦ 売上の成長と利益**：ロイヤルティの高い顧客が増えると、企業の売上と利益が伸びます。

そして、得た利益を再び社内サービス（従業員の環境）に投資することで、この連鎖が回り続けます。

## 具体例
スタッフの研修や待遇に力を入れているテーマパークやホテルでは、スタッフが楽しそうに働き、細やかな対応ができるため、顧客の満足度が高く、リピーターが多くなります。

## ポイント
出発点が「顧客」ではなく「**社内サービスの質（従業員）**」である点が最重要です。「従業員満足（ES）→ 顧客満足（CS）→ 利益」の順番をしっかり覚えましょう。`},
{n:76,u:"サービスマーケティング",t:"サービス・トライアングル",a:"ア",r1:"〇",r2:"〇",b:`**サービス・トライアングル**とは、サービス業のマーケティングを、**企業・従業員・顧客**の3者を頂点とする三角形で表したものです。3者の間には、それぞれ異なる3種類のマーケティングがあります。

## 3つのマーケティング
- **エクスターナル・マーケティング（外部マーケティング）**：**企業 → 顧客**
  - 企業が顧客に対して行う、通常のマーケティング活動です。サービスの内容を設計し、価格を決め、広告などで「こんなサービスを提供します」と**約束をする**活動です。
- **インターナル・マーケティング（内部マーケティング）**：**企業 → 従業員**
  - 企業が従業員に対して行うマーケティングです。従業員を「社内の顧客」と考え、教育、動機づけ、働きやすい環境づくり、報酬などを通じて、従業員が良いサービスを提供できるようにします。約束を**実行できるようにする**活動です。
- **インタラクティブ・マーケティング（相互作用マーケティング）**：**従業員 ↔ 顧客**
  - 従業員と顧客が直接やりとりする場面でのマーケティングです。**サービス・エンカウンター**（No.74）での実際の接客で、約束を**実際に守る**活動です。

## 具体例：ホテル
- エクスターナル：「心からのおもてなし」を広告で約束する
- インターナル：スタッフに研修を行い、顧客の要望に応える権限を与える
- インタラクティブ：フロントのスタッフが、チェックイン時に顧客の要望に丁寧に応える

## なぜ重要か
サービスは従業員が顧客に直接提供するため、外部への約束（広告）だけでなく、**従業員への働きかけ（インターナル）**と、**現場での実際の対応（インタラクティブ）**がそろってはじめて顧客の満足が得られます。

## ポイント
3つのマーケティングと「誰から誰へ」の向きの組み合わせが最重要です。特に「インターナル＝企業から従業員へ」を押さえましょう。サービス・プロフィット・チェーン（No.75）の考え方ともつながっています。`},
];

const QS = [...D1,...D2,...D3,...D4];
const KEY = "mk3-review-done";
let done = new Set();
try { const s = localStorage.getItem(KEY); if (s) done = new Set(JSON.parse(s)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} }
let cur = 1;

const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");

function render(md){
  const out = []; let inList = false, inSub = false;
  const close = () => { if (inSub) { out.push("</ul></li>"); inSub = false; } else if (inList) out.push("</li>"); if (inList) out.push("</ul>"); inList = false; };
  for (const raw of md.split("\n")) {
    const line = raw.replace(/\s+$/,"");
    if (/^  - /.test(line)) {
      if (!inList) { out.push("<ul><li>"); inList = true; }
      if (!inSub) { out.push("<ul>"); inSub = true; }
      out.push("<li>" + inl(line.slice(4)) + "</li>");
    } else if (/^- /.test(line)) {
      if (inSub) { out.push("</ul></li>"); inSub = false; }
      else if (inList) out.push("</li>");
      if (!inList) { out.push("<ul>"); inList = true; }
      out.push("<li>" + inl(line.slice(2)));
    } else if (/^## /.test(line)) {
      close(); out.push("<h3>" + inl(line.slice(3)) + "</h3>");
    } else if (line.trim() === "") {
      close();
    } else {
      close(); out.push("<p>" + inl(line) + "</p>");
    }
  }
  close();
  return out.join("");
}

function progress(){
  const n = done.size, p = (n / QS.length * 100);
  document.getElementById("pct").textContent = (Math.round(p * 10) / 10) + "%";
  document.getElementById("cnt").textContent = n + " / " + QS.length + " 完了";
  document.getElementById("barfill").style.width = p + "%";
}

function buildList(){
  const el = document.getElementById("list"); let html = "", lastU = "";
  for (const q of QS) {
    if (q.u !== lastU) { html += '<div class="unit">' + esc(q.u) + '</div>'; lastU = q.u; }
    const on = done.has(q.n);
    html += '<div class="row' + (on ? " ok" : "") + '" role="button" tabindex="0" data-n="' + q.n + '"' + (q.n === cur ? ' aria-current="true"' : "") + '>' +
      '<span class="no">' + q.n + '</span><span class="tt">' + esc(q.t) + '</span>' +
      '<button class="chk' + (on ? " on" : "") + '" data-c="' + q.n + '" aria-pressed="' + on + '" aria-label="' + q.n + '番を復習完了にする">' + CHECK + '</button></div>';
  }
  el.innerHTML = html;
}

function mark(r){ return r === "✕" ? '<span class="x">✕</span>' : '<span class="o">〇</span>'; }

function show(n, scroll){
  cur = n; const q = QS.find(x => x.n === n); const i = QS.indexOf(q);
  const prev = QS[i - 1], next = QS[i + 1], on = done.has(n);
  document.getElementById("doc").innerHTML =
    '<button class="back" id="back">← 一覧に戻る</button>' +
    '<div class="meta">' + esc(q.u) + '</div>' +
    '<div class="ttl"><span class="big">' + q.n + '</span><h2>' + esc(q.t) + '</h2></div>' +
    '<div class="facts"><span>正答 <b>' + q.a + '</b></span><span>第1回 ' + mark(q.r1) + '</span><span>第2回 ' + mark(q.r2) + '</span></div>' +
    '<button class="toggle' + (on ? " on" : "") + '" id="tg" aria-pressed="' + on + '">' + (on ? "✓ 復習完了" : "復習完了にする") + '</button>' +
    '<div class="body">' + render(q.b) + '</div>' +
    '<div class="nav"><button id="pv"' + (prev ? "" : " disabled") + '>' + (prev ? '<small>← ' + prev.n + '</small>' + esc(prev.t) : "") + '</button>' +
    '<button class="nx" id="nx"' + (next ? "" : " disabled") + '>' + (next ? '<small>' + next.n + ' →</small>' + esc(next.t) : "") + '</button></div>';
  document.getElementById("back").onclick = goBack;
  document.getElementById("tb").innerHTML = '<button class="tb-back" id="tbb">← 一覧</button><span class="tb-no">' + n + ' / ' + QS.length + '</span><button class="tb-chk' + (on ? " on" : "") + '" id="tbc" aria-pressed="' + on + '">' + (on ? "✓ 完了" : "復習完了") + '</button>';
  document.getElementById("tbb").onclick = goBack;
  document.getElementById("tbc").onclick = () => toggle(n);
  document.getElementById("bb").innerHTML = '<button id="bp"' + (prev ? "" : " disabled") + '>← 前へ</button><button id="bn"' + (next ? "" : " disabled") + '>次へ →</button>';
  if (prev) document.getElementById("bp").onclick = () => show(prev.n);
  if (next) document.getElementById("bn").onclick = () => show(next.n);
  document.getElementById("tg").onclick = () => toggle(n);
  if (prev) document.getElementById("pv").onclick = () => show(prev.n, true);
  if (next) document.getElementById("nx").onclick = () => show(next.n, true);
  document.querySelectorAll(".row").forEach(r => r.setAttribute("aria-current", r.dataset.n == n ? "true" : "false"));
  document.getElementById("main").scrollTop = 0;
  try { localStorage.setItem(KEY + "-cur", String(n)); } catch(e) {}
}

function toggle(n){
  done.has(n) ? done.delete(n) : done.add(n); save(); progress();
  const on = done.has(n);
  const row = document.querySelector('.row[data-n="' + n + '"]');
  if (row) { row.classList.toggle("ok", on); const c = row.querySelector(".chk"); c.classList.toggle("on", on); c.setAttribute("aria-pressed", on); }
  if (n === cur) { const t = document.getElementById("tg"); if (t) { t.classList.toggle("on", on); t.setAttribute("aria-pressed", on); t.textContent = on ? "✓ 復習完了" : "復習完了にする"; }
    const c = document.getElementById("tbc"); if (c) { c.classList.toggle("on", on); c.setAttribute("aria-pressed", on); c.textContent = on ? "✓ 完了" : "復習完了"; } }
}

const app = document.getElementById("app");
const mobile = () => matchMedia("(max-width:760px)").matches;
let pushed = false;
function openReading(n){
  show(n); app.classList.add("reading");
  if (mobile() && !pushed) { try { history.pushState({mk3:1}, ""); pushed = true; } catch(e) {} }
}
function closeReading(){
  app.classList.remove("reading");
  const r = document.querySelector('.row[data-n="' + cur + '"]'); if (r) r.scrollIntoView({block:"center"});
}
function goBack(){
  closeReading();
  if (pushed) { pushed = false; try { history.back(); } catch(e) {} }
}
window.addEventListener("popstate", () => { pushed = false; if (app.classList.contains("reading")) closeReading(); });

document.getElementById("list").addEventListener("click", e => {
  const c = e.target.closest(".chk"); if (c) { e.stopPropagation(); toggle(+c.dataset.c); return; }
  const r = e.target.closest(".row"); if (r) openReading(+r.dataset.n);
});
document.getElementById("list").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("row")) { e.preventDefault(); openReading(+e.target.dataset.n); }
});

let sx = 0, sy = 0, st = 0;
const mainEl = document.getElementById("main");
mainEl.addEventListener("touchstart", e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, {passive:true});
mainEl.addEventListener("touchend", e => {
  if (!mobile()) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Date.now() - st > 600 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
  const i = QS.findIndex(q => q.n === cur), to = QS[i + (dx < 0 ? 1 : -1)];
  if (to) show(to.n);
}, {passive:true});

try { const c = +localStorage.getItem(KEY + "-cur"); if (c >= 1 && c <= QS.length) cur = c; } catch(e) {}
buildList(); progress(); show(cur);
</script>
